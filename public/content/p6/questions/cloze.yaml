    source: RedSwastika Primary 6 Chinese Prelim 2026; PDF pages 9; P6_Chinese_Prelim_2026_RedSwastika_Exam_Papers.pdf
    text: |-
      很久以前，一个乡村发生了严重的水灾。农田被水淹了，很多村民都饿死了，生活十分辛苦。

      一位有钱人知道情况后，便[Q16]___了很多食物，到村子里分给村民。他心想：他们吃了我给的食物，一定会称赞我是个好人！

      这一天，有钱人带了食物到村子。这时，一个村民慢慢走来。他已经饿了好几天，走路有气无力。有钱人看见他，立刻举起食物，大声说：“快来吃吧！让我这个[Q17]___的好心人来帮助你！”

      村民说：“帮助别人[Q18]___要真心诚意，才有意义。如果只是为了得到称赞，就失去帮助他人的意义。在帮助别人之前，你应该先[Q19]___自己为什么要做这件事情。”有钱人回答道：“我没有那个意思！”

      村民接着说：“虽然你很有钱，但是我是不会[Q20]___你生活过得那么好的！”有钱人听后，满脸通红，十分惭愧。从那天起，他学会了用真诚的心去帮助别人。
