- groupId: P6-CH-2026-ACSJ-Q30-33
  passage:
    title: 儿童节庆祝会
    source: ACS(J) Primary 6 Chinese Prelim 2026, Paper 2; PDF pages 11–13; P6_Chinese_Prelim_2026_ACSJ_Exam_Papers.pdf
    text: |-
      为了让孩子们度过一个有意义的儿童节，欢乐民众俱乐部将和往年一样在儿童节当天举办四个庆祝活动。此外，今年还将增设美食摊位，售卖美食的钱会全部捐赠给“关爱儿童会”，帮助有需要的儿童。

      欢乐运动会：和家人组队参加“两人三脚”竞赛
      时间：早上8点到早上10点
      注意事项：该活动为户外活动，请自备防晒用品

      变废为宝：利用可回收物品制作手工艺品
      时间：早上9点到早上11点
      注意事项：本俱乐部只提供剪刀，参加者必须带可回收物品

      小画家：由本地著名画家教孩子画画
      时间：下午1点到下午3点
      注意事项：自备彩色笔

      探险家：在树林里探索夜间动物的神秘世界
      时间：晚上6点到晚上8点
      注意事项：必须带手电筒和防蚊用品。10岁以下儿童需家长陪同

      想要参加“探险家”的孩子，请在9月20日前上欢乐民众俱乐部网站www.huanlecc.sg报名。其他活动详情，也请在本网站查看。
  questions:
    - sourceQuestion: Q30
      format: MCQ
      text: 举办儿童节庆祝会的主要目的是什么？
      options:
        - 帮助那些有需要的孩子。
        - 鼓励孩子们参加探险活动。
        - 邀请家人陪同孩子一起做活动。
        - 让孩子们度过一个有意义的儿童节。
      correct: 让孩子们度过一个有意义的儿童节。
    - sourceQuestion: Q31
      format: MCQ
      text: 今年的庆祝会和往年有什么不一样？
      options:
        - 举办了四个活动。
        - 在儿童节当天举行。
        - 增加了售卖美食的摊位。
        - 由欢乐民众俱乐部来举办。
      correct: 增加了售卖美食的摊位。
    - sourceQuestion: Q32
      format: MCQ
      text: 小乐对环保和美术感兴趣，她应该参加哪些活动？
      options:
        - 变废为宝和探险家。
        - 小画家和变废为宝。
        - 欢乐运动会和小画家。
        - 探险家和欢乐运动会。
      correct: 小画家和变废为宝。
    - sourceQuestion: Q33
      marks: 4
      format: Writing-Constrained
      text: 假如你是李强，看到儿童节庆祝活动的通告后，想邀请今年读六年级的智康一起参加“探险家”活动。请你写一个手机短信给他，告诉他这个活动的报名方法，以及他需要注意的事情。
      context: |-
        开头已给出：“智康，我看到‘欢乐民众俱乐部儿童节庆祝活动’的通告，想邀请你和我一起参加‘探险家’这个活动。你一定要在……”
        评分：内容2分，表达2分，共4分。
      displayAnswer: 智康，我看到“欢乐民众俱乐部儿童节庆祝活动”的通告，想邀请你和我一起参加“探险家”这个活动。你一定要在9月20日前上欢乐民众俱乐部网站报名。活动当天必须带手电筒和防蚊／防虫用品。
- groupId: P6-CH-2026-AiTong-Q30-33
  subject: Chinese
  passage:
    title: 欢乐家庭节
    source: AiTong Primary 6 Chinese Prelim 2026; PDF pages 10–12; P6_Chinese_Prelim_2026_AiTong_Exam_Papers.pdf
    text: |-
      一年一度的欢乐家庭节又到了。今年欢乐家庭节以“加倍幸福，由我开始”为主题，鼓励大家从日常生活中的小事做起，用行动表达对家人的关爱。

      为期一个月的欢乐家庭节会在7月1日于滨海艺术中心举行开幕典礼。为了吸引全家人的参与，艺术中心当天会举办以下的活动。

      活动一亲子互动游戏：通过玩游戏，了解家庭成员时间：上午十点到十一点

      活动二体育健身活动：通过做运动，拉近彼此的距离时间：下午两点到三点

      为了配合欢乐家庭节，全岛多个民众俱乐部从7月2日至31日将举办各种活动，例如：户外电影、手工制作及数码健康活动等。想了解活动详情的公众，请上民众俱乐部的网站www.julebu.com查看，或拨打民众俱乐部的热线电话61234567。
  questions:
    - sourceQuestion: Q30
      marks: 2
      format: MCQ
      text: 今年举办欢乐家庭节的主要目的是什么？
      options:
        - 提醒大家参加今年欢乐家庭节的活动。
        - 通过游戏的方式进一步了解家庭成员。
        - 鼓励大家通过生活中的小事关爱家人。
        - 吸引全家人一起参与开幕典礼的活动。
      correct: 鼓励大家通过生活中的小事关爱家人。
    - sourceQuestion: Q31
      marks: 2
      format: MCQ
      text: 想了解7月10日活动详情的人应该怎么做？
      options:
        - 去全岛的民众俱乐部报名。
        - 到民众俱乐部的网站查看。
        - 拨打欢乐家庭节的热线电话。
        - 到滨海艺术中心办公室询问。
      correct: 到民众俱乐部的网站查看。
    - sourceQuestion: Q32
      marks: 2
      format: MCQ
      text: 民众俱乐部不负责以下哪项活动？
      options:
        - 手工制作活动。
        - 数码健康活动。
        - 户外电影活动。
        - 体育健身活动。
      correct: 体育健身活动。
    - sourceQuestion: Q33
      marks: 4
      format: Writing-Constrained
      text: 假如你是国文，看到这则广告后，想起这个周末爸爸要去爷爷奶奶家看望他们。请你写一个手机短信给爸爸，让他带你和爷爷奶奶去参加家庭节开幕典礼早上的活动，告诉他活动的地点和时间，以及参加该项活动的好处。
      context: 开头：“爸爸，我知道您周末会去爷爷奶奶家。我想要您带我和爷爷奶奶去参加家庭节的开幕活动，您可以……”
      displayAnswer: 爸爸，我知道您周末会去爷爷奶奶家。我想要您带我和爷爷奶奶去参加家庭节的开幕活动，您可以带我们参加亲子互动游戏。活动的地点是滨海艺术中心（0.5分），时间是7月1日早上十点到十一点（0.5分）。我们可以通过玩游戏（0.5分），了解家庭成员（0.5分）。
- groupId: P6-CH-2026-HenryPark-Q30-33
  subject: Chinese
  passage:
    title: 给它一个家，给你一份爱
    source: HenryPark Primary 6 Chinese Prelim 2026; PDF pages 10–11; P6_Chinese_Prelim_2026_HenryPark_Exam_Papers.pdf
    text: |-
      爱心领养中心
      健康已去虫／已打预防针／赠送新手礼包

      为了给流浪的猫狗找个家，鼓励更多公众领养小动物，爱心领养中心即将举办“给它一个家，给你一份爱”的领养活动。活动时间是从2026年7月1日至7月31日。

      贴心配套：
      所有等待被领养的动物已经过健康检查、去虫并打了预防针。在活动期间成功领养动物的领养者，将享有以下优待：
      ○ 获得爱心新手礼包。礼包包含了宠物喂食碗、牵引绳、宠物饼干及护理宠物手册。
      ○ 在领养后将享受三个月的免费宠物行为指导和兽医服务。
      ○ 购买终身宠物保险将享有八折的折扣。
      注意：活动结束之后领养动物不再享有优待。

      别再等待，快来加入我们的活动，给它一个温暖的家！活动期间您可以先上本中心的网站（www.loveanimal.com.sg）查看宠物的照片和基本信息。有兴趣的公众请通过网站预约后，才前往本中心完成领养手续。本中心在全岛共有8家分店。
  questions:
    - sourceQuestion: Q30
      marks: 2
      format: MCQ
      text: 这则通告主要是要告诉大家___。
      options:
        - 领养中心将赠送领养者新手礼包。
        - 领养者可以领养流浪猫狗的时间。
        - 领养中心将举办动物领养的活动。
        - 领养者需上领养中心的网站查询。
      correct: 领养中心将举办动物领养的活动。
    - sourceQuestion: Q31
      marks: 2
      format: MCQ
      text: 以下哪一项不是活动期间提供的优待？
      options:
        - 健康检查与去虫。
        - 已经打了预防针。
        - 终身免费宠物保险。
        - 三个月的兽医服务。
      correct: 终身免费宠物保险。
    - sourceQuestion: Q32
      marks: 2
      format: MCQ
      text: 以下哪一句话是不正确的？
      options:
        - 领养后可获得三个月免费行为指导。
        - 可上网查看可领养动物的基本信息。
        - 爱心领养中心在全岛共有八家分店。
        - 领养者只能在2026年7月领养宠物。
      correct: 领养者只能在2026年7月领养宠物。
    - sourceQuestion: Q33
      marks: 4
      format: Writing-Constrained
      text: 如果你是李丽，你想鼓励家人一起参加爱心领养中心的领养活动。请你写一张便条告诉妈妈你想参加这个活动的原因，并说明要如何领养宠物。
      context: |-
        开头：“亲爱的妈妈：我很喜欢小动物，一直想要领养一只。刚好爱心领养中心将举办‘给它一个家，给你一份爱’领养活动，我想和你一起参加，因为……”
        署名：李丽；6月21日，上午9点。
      displayAnswer: |-
        亲爱的妈妈：
        我很喜欢小动物，也想给流浪动物一个温暖的家，所以想和你一起参加领养活动。我们可以先上爱心领养中心的网站查看宠物的照片和基本信息，通过网站预约后，再前往中心完成领养手续。
        李丽
- groupId: P6-CH-2026-NanHua-Q30-33
  subject: Chinese
  passage:
    title: 屋顶农场等你来！
    source: NanHua Primary 6 Chinese Prelim 2026; PDF pages 12–14; P6_Chinese_Prelim_2026_NanHua_Exam_Papers.pdf
    text: |-
      你知道吗？在屋顶种菜有很多好处。首先，屋顶阳光充足，适合植物生长。其次，收获的蔬菜可以带回家，吃得健康又安心。更重要的是，邻居们可以一起劳动、分享快乐！我们将要举办一个屋顶种菜的讲座活动，快来参加吧！
      屋顶种菜的秘密
      日期：2026年11月1日
      时间：上午10点至11点30分
      地点：欢乐民众俱乐部大讲堂
      主讲人：王先生主讲人会介绍不同蔬菜的种植方法，还会在讲座后教大家用旧瓶子做漂亮的花盆！参加手工制作活动的居民还可以获得免费小礼物哦！
      如何报名参加讲座？请在2026年10月10日前到欢乐民众俱乐部填写报名表格。
      如有疑问，请拨打电话：67891234。
  questions:
    - sourceQuestion: Q30
      marks: 2
      format: MCQ
      text: 这个海报的主要目的是___。
      options:
        - 教导邻居们用旧瓶子制作花盆
        - 邀请居民们参加屋顶农场讲座
        - 说明屋顶农场可以带来的好处
        - 告诉大家不同蔬菜的种植方法
      correct: 邀请居民们参加屋顶农场讲座
    - sourceQuestion: Q31
      marks: 2
      format: MCQ
      text: 如果你和家人想参加讲座，你们应该怎么做？
      options:
        - 打电话给王先生报名
        - 在讲座当天直接去参加
        - 拨打民众俱乐部电话报名
        - 到民众俱乐部填写报名表格
      correct: 到民众俱乐部填写报名表格
    - sourceQuestion: Q32
      marks: 2
      format: MCQ
      text: 以下哪一项不是屋顶种菜的好处？
      options:
        - 能够加强邻居们之间的友好关系
        - 可以用旧瓶子做成的花盆来种菜
        - 屋顶充足的阳光更适合植物生长
        - 居民们可以安心地吃健康的蔬菜
      correct: 可以用旧瓶子做成的花盆来种菜
    - sourceQuestion: Q33
      marks: 4
      format: Writing-Constrained
      text: 如果你是志文，看到这张海报后，想起喜欢种菜的奶奶，于是你写了一则短信邀请奶奶一起参加这个活动，告诉奶奶活动的详情，以及你觉得她应该参加这个活动的一个原因。
      context: 开头：“奶奶，我知道您很喜欢种菜，想……”
      displayAnswer: 奶奶，我知道您很喜欢种菜，想邀请您一起参加一个屋顶种菜的讲座，这个讲座将于2026年11月1日上午10点至11点30分，在欢乐民众俱乐部大讲堂举行。参加这个讲座您可以了解不同蔬菜的种植方法，希望您可以和我一起去。
- groupId: P6-CH-2026-Nanyang-Q30-33
  subject: Chinese
  passage:
    title: 机器人欢乐展
    source: Nanyang Primary 6 Chinese Prelim 2026; PDF pages 13–15; P6_Chinese_Prelim_2026_Nanyang_Exam_Papers.pdf
    text: |-
      为了激发公众对机器人的兴趣，感受科技带来的乐趣，创意机器人协会将举办“机器人欢乐展”。展览会将展出各种机器人，比如“跳舞机器人”“足球机器人”等。除了在现场为参观者介绍和演示不同的机器人，协会还在10月3号安排了各种现场体验活动，欢迎有兴趣的公众前来参观哦！
      展览详情：
      日期：10月2日至10月3日
      时间：上午10点至下午4点半
      地点：创意机器人协会，一楼展览厅票价：每人10元（学生免费入场）
      现场机器人体验活动（10月3号）：
      活动一机器人对战
      活动二机器人推盒子
      活动三机器人抓小球
      活动四：动手组装机器人该活动仅限中学生参加。若组装成功，可免费将机器人带回家。

      有兴趣参观“机器人欢乐展”的公众，可在展览会当天购票。

      若有任何疑问，请打电话给创意机器人协会：+6512345678。

      为了庆祝儿童节，凡在10月2日来参观的小学生都会获得一份神秘礼物。
      创意机器人协会2026年8月1日
  questions:
    - sourceQuestion: Q30
      marks: 2
      format: MCQ
      text: 这则通告的主要目的是什么？
      options:
        - 鼓励爱好机器人的公众来分享。
        - 激发公众对机器人科技的兴趣。
        - 吸引公众前来参观机器人展览。
        - 邀请公众一起前来庆祝儿童节。
      correct: 吸引公众前来参观机器人展览。
    - sourceQuestion: Q31
      marks: 2
      format: MCQ
      text: 以下哪一项不是展览现场的体验活动？
      options:
        - 机器人抓小球。
        - 机器人推盒子。
        - 动手组装机器人。
        - 人与机器人对战。
      correct: 人与机器人对战。
    - sourceQuestion: Q32
      marks: 2
      format: MCQ
      text: 以下哪个句子是正确的？
      options:
        - 只有小学生们可以免费参观这个机器人展览。
        - 10月2日参展的小学生们都能获得一份礼物。
        - 参观者们将有机会在现场演示不同的机器人。
        - 想参观展览的人们需上网报名并购买入门票。
      correct: 10月2日参展的小学生们都能获得一份礼物。
    - sourceQuestion: Q33
      marks: 4
      format: Writing-Constrained
      text: 看了这则通告后，你想起上中学的表哥一直很喜欢组装机器人。请写一则短信给表哥，向他介绍这个展览中一个他感兴趣的活动，以及这个活动的详情和一个好处。
      context: 开头：“表哥，我知道你对组装机器人非常感兴趣，……”
      displayAnswer: 表哥，我知道你对组装机器人非常感兴趣，创意机器人协会将举办“机器人欢乐展”活动。展览中有个“动手组装机器人”的活动很适合你，这个活动的日期是10月3日，时间是上午10点至下午4点半，地点是创意机器人协会一楼展览厅。若组装成功，可以免费将机器人带回家。
- groupId: P6-CH-2026-PLMGS-Q30-33
  subject: Chinese
  passage:
    title: 防止沉迷网络
    source: PLMGS Primary 6 Chinese Prelim 2026; PDF pages 11–13; P6_Chinese_Prelim_2026_PLMGS_Exam_Papers.pdf
    text: |-
      安康民众俱乐部将于今年10月25日举办一年一度的“防止沉迷网络”活动，希望家长和孩子能知道如何正确使用网络，培养这方面的好习惯。与往年不同的是，除了讲座外，今年也会举办一场与“防止沉迷网络”有关的知识竞赛。竞赛设有10份奖品供大家赢取。
      活动
      地点：安康民众俱乐部一楼活动厅
      活动
      时间：上午9点至中午12点
      活动费用：每人10元（当天付费）
      报名方式：到安康民众俱乐部办公室报名
      报名
      日期：10月15日到10月20日
      如果想了解更多活动详情，请到我们的网站www.ankang.com查看。欢迎大家积极报名参加。
      安康民众俱乐部10月1日
  questions:
    - sourceQuestion: Q30
      marks: 2
      format: MCQ
      text: 这个广告的主要目的是什么？
      options:
        - 教导家长和孩子正确使用网络的习惯。
        - 建议家长和孩子参加俱乐部举办的活动。
        - 鼓励家长和孩子参加“防止沉迷网络”活动。
        - 通知家长和孩子“防止沉迷网络”的知识竞赛。
      correct: 鼓励家长和孩子参加“防止沉迷网络”活动。
    - sourceQuestion: Q31
      marks: 2
      format: MCQ
      text: 今年的“防止沉迷网络”活动有什么不同的地方？
      options:
        - 讲座时间比去年的长。
        - 报名的时间比去年早。
        - 增加了一个知识竞赛。
        - 参加活动的人有奖品。
      correct: 增加了一个知识竞赛。
    - sourceQuestion: Q32
      marks: 2
      format: MCQ
      text: 想了解活动详情的人应该怎么做？
      options:
        - 到办公室问工作人员。
        - 找工作人员领取广告。
        - 活动当天去现场询问。
        - 上俱乐部的网站查看。
      correct: 上俱乐部的网站查看。
    - sourceQuestion: Q33
      marks: 4
      format: Writing-Constrained
      text: 假如你是小文，你和妈妈看了“防止沉迷网络”的广告后，决定报名参加。请写一张便条给妈妈，提醒她报名时要注意的地方。
