        妈妈：
        记得我们说过要一起参加安康民众俱乐部举办的“防止沉迷网络”活动，我想提醒您报名日期是10月15日至20日，您必须到安康民众俱乐部办公室报名。活动费用是每个人10元，但不必在报名时缴付，活动当天才付款。
- groupId: P6-CH-2026-Raffles-Q30-33
  subject: Chinese
