      correct: 书法家亲自到场为居民写春联。
    - sourceQuestion: Q33
      marks: 4
      format: Long-Answer
      text: |-
        如果你是小云，你知道你的好朋友乐文喜欢做手工，请写一则短信给她，建议她参加新年庆祝会的其中一项活动，并告诉她参加这项活动的注意事项。
        开头：乐文，我们家附近的欢乐民众俱乐部将举办“马年大吉”新年庆祝会，我知道你喜欢做手工，你可以参加……
      displayAnswer: 乐文，我们家附近的欢乐民众俱乐部将举办“马年大吉”新年庆祝会，我知道你喜欢做手工，你可以参加“动手做一做”活动，制作新春贺卡。参加这个活动需要付两元材料费。如果有空，记得到时去参加哦！
