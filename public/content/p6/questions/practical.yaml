- groupId: P6-CH-2026-RedSwastika-Q30-33
  subject: Chinese
  passage:
    title: 智能手机学习班
    source: RedSwastika Primary 6 Chinese Prelim 2026; PDF pages 13–15; P6_Chinese_Prelim_2026_RedSwastika_Exam_Papers.pdf
    text: |-
      亲爱的叔叔阿姨们：
      您是否有智能手机却不会用？为了帮助您学会使用智能手机，让生活更便利，康康民众俱乐部将为您开办一系列的学习课程，帮助您不再害怕使用智能手机。

      初级班：
      课程1：智能手机基本使用教学——让初学者了解手机的用处；5月8日下午2点。
      课程2：通过网络与亲友见面——学会上网，和亲友保持联系；5月9日下午2点。
      课程3：手机让生活更便利——学会网上购物；5月15日上午10点。
      课程4：智能手机与日常生活——能看新闻，也能追看电视剧；5月16日上午10点。

      地点：康康民众俱乐部电脑室
      收费：一个课程$25；报名所有课程，学费打八折。
      参加者：60岁或以上的居民
      您可以到康康民众俱乐部的办公室报名。
      首20位报名者可得到一个精美的手机支架。
      报名截止日期：5月5日下午4点。
      我们的工作人员将在5月1日上午为大家现场讲解并填写报名表格。您也可以拨打电话91238888向王文华先生了解详情。
      康康民众俱乐部
      2026年4月20日
  questions:
    - sourceQuestion: Q30
      marks: 2
      format: MCQ
      text: 举办“智能手机学习班”的主要目的是什么？
      options:
        - 让老年人常常与亲友保持联系。
        - 让老年人上网看新闻和电视剧。
        - 让老年人向工作人员了解详情。
        - 让老年人不害怕使用智能手机。
      correct: 让老年人不害怕使用智能手机。
    - sourceQuestion: Q31
      marks: 2
      format: MCQ
      text: 想报名参加课程的人应该怎么做？
      options:
        - 在5月1日之前打电话找王先生。
        - 在5月1日当天到民众俱乐部去。
        - 在5月8日之前找家人了解详情。
        - 在5月8日到16日之间报名上课。
      correct: 在5月1日当天到民众俱乐部去。
    - sourceQuestion: Q32
      marks: 2
      format: MCQ
      text: 以下哪一点是广告的内容？
      options:
        - 5月1日当天才能报名。
        - 欢迎全部居民报名参加。
        - 学会上网买东西的便利。
        - 全部课程学费是一百元。
      correct: 学会上网买东西的便利。
    - sourceQuestion: Q33
      marks: 4
      format: Writing-Constrained
      text: 假如你是文乐，看到这则广告，想到了外婆也可以学习用智能手机，以后能主动和在国外工作的阿姨上网通话。请写一个短信给外婆，告诉她哪一个课程适合她，以及尽早报名的原因。
      context: 开头：“外婆，康康民众俱乐部将举办一些智能手机学习课程。为了能让您随时和在国外的阿姨通话，您可以……”
      displayAnswer: 外婆，您可以报名课程2“通过网络与亲友见面”，因为这个课程能让您学习使用智能手机跟在国外的阿姨上网通话。请尽早报名，因为首20名报名者可获一个精美的手机支架。
- groupId: P6-CH-2026-StNicholas-Q30-33
  subject: Chinese
  passage:
    title: 武术班招生啦！
    source: StNicholas Primary 6 Chinese Prelim 2026; PDF pages 13–14; P6_Chinese_Prelim_2026_StNicholas_Exam_Papers.pdf
    text: |-
      想让你的孩子更健康吗？欢迎参加武术班！
      这两个月的课程结合了武术和中华传统文化，让小朋友在快乐地练习武术、锻炼身体的同时，也学会与他人合作。

      日期：8月22日至10月25日
      地点：武术俱乐部七楼课室
      初级班：没学过武术的儿童；每周六上午10点至11点30分；640元（8节课）。
      高级班：有学过武术的儿童；每周日上午10点至11点30分；720元（8节课）。
      最前10位报名者可获赠一份价值20元的小礼物。

      由于招生人数有限，请尽早上网www.wushujulebu.com.sg报名。如果你有疑问，可拨打61234567向办公室的李珍珍女士询问。
      武术俱乐部
      6月5日
