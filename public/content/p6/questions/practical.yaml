    title: 书香伴我行——中文书展
    source: Raffles Primary 6 Chinese Prelim 2026; PDF pages 15–16; P6_Chinese_Prelim_2026_Raffles_Exam_Papers.pdf
    text: |-
      六月假期马上就要到了！为了鼓励孩子们在假期时能养成阅读的好习惯，欢乐民众俱乐部特别举办这场书展。现场购买书本的前50名读者，将免费获得一份惊喜小礼包。

      活动详情：
      日期：2026年5月25日至6月28日
      时间：上午九点至晚上八点
      地点：欢乐民众俱乐部

      周末特别活动：
      讲座：5月30日下午两点，著名诗人林美将来到现场，与大家分享她写的诗歌。
      签名会：6月16日下午三点，最受欢迎漫画家胡田将来到现场。赶紧带上胡田的书，来获取签名吧！
