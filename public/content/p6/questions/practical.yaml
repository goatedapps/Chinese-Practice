        - 鼓励居民一起制作新年手工。
        - 给居民尝一尝新年美食的机会。
        - 邀请居民感受节日的快乐气氛。
      correct: 让居民了解华族传统文化。
    - sourceQuestion: Q31
      marks: 2
      format: MCQ
      text: 居民应该怎么做才能得到马年娃娃？
      options:
        - 上网报名。
