- groupId: P6-CH-2026-ACSJ-Q21-25
  subject: Chinese
  passage:
    title: 明华捡到钱包
    source: ACS(J) Primary 6 Chinese Prelim 2026, Paper 2; PDF pages 7–8; P6_Chinese_Prelim_2026_ACSJ_Exam_Papers.pdf
    text: |-
      一天放学后，同学们都争先恐后地离开学校，明华找不到伙伴一起玩耍，只好独自去操场踢球。

      明华踢了一段时间后，累得上气不接下气，想要休息一会儿。他弯下腰去捡球时，无意中在草丛里发现了一个黑色的钱包。他捡起钱包，好奇地打开来一看，发现里面有好几张五十元的钞票，还有一张学生证。明华看了看四周，操场上静悄悄的，一个人影也没有。

      看着这些钱，明华的心跳加速。他心想：这么多钱，正好可以买下我喜欢的那套玩具！有了它，同学们一定会羡慕我。他担心老师从办公室出来时会看到他，或失主会突然出现，连忙把钱包塞进书包，准备离开操场。

      就在这时，明华听见不远处传来一阵哭声。他顺着声音望去，只见一个小男生一边擦眼泪，一边不停地寻找着什么。小男生哭得很伤心，嘴里还小声念着：“怎么办？那是妈妈给我买书的钱啊，弄丢了她会责怪我的……”

      明华听了，两只脚像生了根一样，一步也走不动了。他想起了老师在周会上讲过的道理，也想起了父母平时的教导。明华拿定了主意，深深吸了一口气，快步走向那个小男生。

      明华把钱包递给小男生，轻声问：“这是你的吗？”小男生抬起头，眼睛一亮，抹干眼泪，笑着连声说：“谢谢哥哥！谢谢哥哥！”说完，小男孩就转身离开。看着小男生远去的身影，明华放下了心中的大石。
  questions:
    - sourceQuestion: Q21
      format: MCQ
      text: 明华的心跳得很快，是因为___。
      options:
        - 他发现钱包里有很多钱。
        - 他担心失主会突然出现。
        - 他实在是累得喘不过气。
        - 他怕一个人留在操场上。
      correct: 他发现钱包里有很多钱。
    - sourceQuestion: Q22
      format: MCQ
      text: 明华离开操场前，打算做什么？
      options:
        - 找伙伴一起玩耍。
        - 赶紧把钱包带走。
        - 去办公室找老师。
        - 等失主来领钱包。
      correct: 赶紧把钱包带走。
    - sourceQuestion: Q23
      format: MCQ
      text: 什么事情让小男生哭得那么伤心？
      options:
        - 他不小心跌倒受伤了。
        - 他忘了带书本去上课。
        - 他弄丢了妈妈给他的钱。
        - 他找不到可以一起玩的朋友。
      correct: 他弄丢了妈妈给他的钱。
    - sourceQuestion: Q24
      format: MCQ
      text: 文中“两只脚像生了根一样”说明了什么？
      options:
        - 明华的腿酸得走不动。
        - 明华不想被小男生发现。
        - 明华急得在操场上团团转。
        - 明华为自己的想法感到惭愧。
      correct: 明华为自己的想法感到惭愧。
    - sourceQuestion: Q25
      format: MCQ
      text: 最后，明华为什么放下了心中的大石？
      options:
        - 因为他把钱包还给了小男生。
        - 因为他得到了小男生的赞许。
        - 因为没人看见他把钱包拿走了。
        - 因为小男孩在操场找到了钱包。
      correct: 因为他把钱包还给了小男生。
- groupId: P6-CH-2026-ACSJ-Q34-40
  subject: Chinese
  passage:
    title: 班上的失物
    source: ACS(J) Primary 6 Chinese Prelim 2026, Paper 2; PDF pages 15–16; P6_Chinese_Prelim_2026_ACSJ_Exam_Papers.pdf
    text: |-
      最近，六年级甲班发生了一些怪事。

      星期一休息时间过后，李明桌上的一张星星贴纸和丽华桌上的金色发夹，好像变魔术一样消失了。难道班上出了小偷？新来的同学——小安成了李明和丽华怀疑的对象。小安本来就没什么朋友，李明和丽华又在他背后说他的坏话，同学们更不敢靠近小安，使他变得更加孤单。

      班长文文劝李明和丽华在没有弄清情况前不该在小安背后说他的坏话。李明却说：“他没来之前，我们班从来没丢过东西！”

      丽华则觉得文文在帮小安，气得涨红了脸，说：“李明说得对！这个班上只有小安家境贫穷，不是他还能是谁？”文文听了，摇了摇头，下定决心要找出偷东西的人。

      星期五的休息时间，同学们都去食堂吃东西。文文躲在课室门外，偷偷地观察。不一会儿，一只小鸟从窗外飞了进来。它东张西望，接着飞到丽华的桌上用爪子抓起一张亮晶晶的糖果纸，飞出窗外。不一会儿，小鸟又飞了回来，重复了相同的动作。

      “会不会是它？”文文自言自语道。他朝着小鸟飞走的方向追去，在课室外的一棵树上发现了一个鸟窝。文文请校工帮忙取下鸟窝后一看，脸上不禁露出了笑容。

      休息时间过后，文文把他的发现告诉了全班同学。听了文文的话，丽华脸红得像番茄，不停地跟小安道歉。这时，同学们不约而同地看向李明，只见他的头低得都快碰到胸口了……
  questions:
    - sourceQuestion: Q34
      format: Fill-in
      text: 文中表示“东西减少到完全没有或完全不见”的词语是：___。
      accepted:
        - 消失
      displayAnswer: 消失
    - sourceQuestion: Q35
      format: Fill-in
      text: 文中表示“独自一人，无人陪伴”的词语是：___。
      accepted:
        - 孤单
      displayAnswer: 孤单
    - sourceQuestion: Q36
      marks: 3
      format: Long-Answer
      text: 六年级甲班发生了什么事？
      displayAnswer: 李明桌上的一张星星贴纸和丽华桌上的金色发夹，好像变魔术一样消失了。
    - sourceQuestion: Q37
      marks: 3
      format: Long-Answer
      text: 李明和丽华怀疑小安的原因是什么？（2分）他们的行为对小安造成什么影响？（1分）
      displayAnswer: |-
        （A）那是因为小安没来之前，班上从来没丢过东西，而且班上只有小安家境贫穷。
        （B）李明和丽华总在小安背后说他的坏话，同学们不敢靠近小安，使他变得更加孤单。
    - sourceQuestion: Q38
      marks: 4
      format: Long-Answer
      text: “会不会是它”这句话说明了什么？（2分）为什么文文看了鸟窝后脸上露出笑容？（2分）
      displayAnswer: |-
        （A）这说明了文文猜想是小鸟拿走了东西。
        （B）因为文文在鸟窝里找到了李明和丽华的东西，可以证明小安不是小偷。
    - sourceQuestion: Q39
      marks: 4
      format: Long-Answer
      text: 丽华两次脸红的感受和原因有什么不同？
      displayAnswer: |-
        丽华第一次脸红时，她感到生气，因为她以为文文在帮小安。
        丽华第二次脸红时，她感到惭愧，因为她错怪了小安。
    - sourceQuestion: Q40
      marks: 4
      format: Long-Answer
      text: 如果你是小安，你会原谅李明吗？为什么？
      displayAnswer: |-
        答案一：如果我是小安，我不会原谅李明。因为他怀疑我偷东西，还在我背后说我的坏话，知道自己错怪我后却没有向我道歉。
        或
        答案二：如果我是小安，我会原谅李明。因为同学之间不该计较，李明低下头说明他已经知道错了，只是没有认错的勇气。
- groupId: P6-CH-2026-AiTong-Q21-25
  subject: Chinese
  passage:
    title: 志明的生日礼物
    source: AiTong Primary 6 Chinese Prelim 2026; PDF pages 7–8; P6_Chinese_Prelim_2026_AiTong_Exam_Papers.pdf
    text: |-
      每当有同学过生日时，志明总会送上一份礼物，他觉得自己十分慷慨。不过，他送出去的东西大多是自己不再喜欢或不再需要的旧物品，例如玩旧了的玩具或用过的文具。

      最近，班上一位同学过生日，志明把自己不要的玩具汽车送给对方。他看见同学收下礼物，便得意地想：我很爱惜东西，不会随便把旧东西丢掉！同学们收到礼物时，都会礼貌地说声谢谢，这让志明一直以为大家都很喜欢他送的礼物。

      终于到了志明的生日。他满心期待地拆开妈妈送给他的礼物，却发现里面是一个旧书包。那个书包虽然还能用，却已经有些掉色了。志明失望地对妈妈说：“这就是你送我的生日礼物吗？这不是你都不用的旧东西吗？”妈妈听了，平静地说：“你平时送给同学们的礼物，不也都是你不需要的旧东西吗？”

      这句话像当头棒喝，志明顿时沉默了。他回想起自己送出的那些礼物，忽然明白了妈妈的用意。他一直以为自己很爱惜东西，其实只是把不要的东西送出去。收到礼物的人未必会开心，只是不好意思说出来。

      看到儿子明白了道理，妈妈才笑着拿出一个全新的篮球递给他，说：“送礼物最重要的不是价格高低，而是要考虑别人是否喜欢、是否需要。”

      志明高兴地接过这个新礼物，使劲地点了点头。
  questions:
    - sourceQuestion: Q21
      marks: 2
      format: MCQ
      text: 为什么志明一直认为自己是个慷慨的人？
      options:
        - 因为他不会随便把旧东西丢掉。
        - 因为他总是买礼物送给同学们。
        - 因为他常把自己的旧东西送给别人。
        - 因为同学收到礼物都会对他说谢谢。
      correct: 因为他常把自己的旧东西送给别人。
    - sourceQuestion: Q22
      marks: 2
      format: MCQ
      text: 当志明收到旧书包时，为什么会感到失望？
      options:
        - 因为书包已经掉色了，不能继续使用。
        - 因为他原以为能收到更多的生日礼物。
        - 因为他觉得生日礼物应该是一个篮球。
        - 因为他没想到妈妈会送他一个旧书包。
      correct: 因为他没想到妈妈会送他一个旧书包。
    - sourceQuestion: Q23
      marks: 2
      format: MCQ
      text: 文中“这句话像当头棒喝”是什么意思？
      options:
        - 妈妈的话让志明感到十分不好意思。
        - 妈妈的话让志明立刻明白了自己的错误。
        - 妈妈的话让志明觉得同学们在故意欺骗他。
        - 妈妈的话让志明以为自己受到了不公平的对待。
      correct: 妈妈的话让志明立刻明白了自己的错误。
    - sourceQuestion: Q24
      marks: 2
      format: MCQ
      text: 妈妈送旧书包给志明，目的是什么？
      options:
        - 让志明知道旧的东西也有用处。
        - 让志明体会收到旧礼物的感受。
        - 让志明养成爱惜东西的好习惯。
        - 让志明懂得珍惜自己的旧东西。
      correct: 让志明体会收到旧礼物的感受。
    - sourceQuestion: Q25
      marks: 2
      format: MCQ
      text: 志明后来有什么改变？
      options:
        - 他学会了怎样为别人选生日礼物。
        - 他学会了主动帮助有需要的同学。
        - 他学会了考虑别人的感受和需求。
        - 他学会了选礼物不看价格的高低。
      correct: 他学会了考虑别人的感受和需求。
- groupId: P6-CH-2026-AiTong-Q34-40
  subject: Chinese
  passage:
    title: 真正的准时
    source: AiTong Primary 6 Chinese Prelim 2026; PDF pages 13–14; P6_Chinese_Prelim_2026_AiTong_Exam_Papers.pdf
    text: |-
      明华是学校足球队的一员。他球技不错，可是他有一个坏习惯就是总爱迟到。教练虽然没有抱怨，但心里十分不满。队员们也经常提醒明华不要迟到，可是明华却把大家的话当成耳边风。他觉得迟到几分钟不是什么大事，并没有认真看待自己的问题。

      一天，教练把明华叫到身边，认真地说：“明天的训练地点比较远，集合时间是早上七点半。如果你再迟到就要受罚，甚至退出足球队。”听了教练的话，明华顿时紧张起来。他非常喜欢足球，当然不甘愿离开球队，于是连忙向教练保证：“教练，我明天一定会准时到达。”队员们听了，简直不敢相信自己的耳朵。有些队员说他如果能准时出现，那可真是太阳从西边出来了。

      第二天，明华特地把闹钟调早了一些。虽然起床后还是有些拖延，但他总算在七点半赶到了集合地点。当他看到训练场上的时间正好显示七点半时，心里十分得意。他兴高采烈地走到教练面前，笑着说：“教练，您看，我今天没有迟到吧！”教练没有马上回答，只是指了指球场上的队员们。明华发现其他的队员已经换好球服，正在球场旁等他。

      这时，教练耐心地说：“你虽然在七点半到达，但其实已经迟到了。你看，很多队员已经做好了训练前的准备。可是你还需要时间换衣服和热身。这样一来，还是减少了全队的训练时间。”明华听了，惭愧地低下了头。教练又继续说道：“你要知道真正的准时，不只是按时到达，更应该要提前做好准备。”明华抬起头来，似乎明白了其中的道理。
  questions:
    - sourceQuestion: Q34
      marks: 2
      format: Fill-in
      text: 文中表示“心里十分愿意”的词语是：___。
      accepted:
        - 甘愿
      displayAnswer: 甘愿
    - sourceQuestion: Q35
      marks: 2
      format: Fill-in
      text: 文中表示“终于、最后”的词语是：___。
      accepted:
        - 总算
      displayAnswer: 总算
    - sourceQuestion: Q36
      marks: 3
      format: Long-Answer
      text: 明华有什么坏习惯？（1分）对于这个坏习惯，明华的想法是什么？（2分）
      displayAnswer: 明华总爱迟到（1分）。他觉得迟到几分钟不是什么大事（2分）。
    - sourceQuestion: Q37
      marks: 4
      format: Long-Answer
      text: 听到教练说再迟到就要受罚，明华有什么反应？（2分）他为什么会有这样的反应？（2分）
      displayAnswer: 明华顿时紧张了起来（1分），连忙向教练保证（0.5分）他明天一定会准时到达（0.5分）。因为他非常喜欢足球（1分），不甘愿离开球队（1分）。
    - sourceQuestion: Q38
      marks: 4
      format: Long-Answer
      text: 文中“那可真是太阳从西边出来了”的意思是什么？（2分）队员们为什么会这么说？（2分）
      displayAnswer: 队员们不相信（1分）明华能准时到达（1分）。因为以前队员们经常提醒明华不要迟到（1分），可是明华把大家的话当耳边风（1分）。
    - sourceQuestion: Q39
      marks: 3
      format: Long-Answer
      text: 明华七点半准时到了训练场地，为什么教练还是觉得明华迟到了？
      displayAnswer: 因为其他的队员已经做好了训练前的准备（1分），可是明华还需要时间换衣服和热身（1分），他还是减少了全队的训练时间（1分）。
    - sourceQuestion: Q40
      marks: 4
      format: Long-Answer
      text: 明华最后明白了什么道理？（1分）你同意这个道理吗？试用生活中的例子加以说明。（3分）
      displayAnswer: 明华最后明白了真正的准时不只是按时到达，更应该要提前做好准备（1分）。我同意这个道理。例如，休息时间结束前（1分），我提早回到课室，还准备好下一节课所需要的课本（1分），这样可以开始专心上课（1分）。
- groupId: P6-CH-2026-HenryPark-Q21-25
  subject: Chinese
  passage:
    title: 照顾仓鼠球球
    source: HenryPark Primary 6 Chinese Prelim 2026; PDF pages 7–8; P6_Chinese_Prelim_2026_HenryPark_Exam_Papers.pdf
    text: |-
      教室后方放着一个玻璃箱子，里面住着小仓鼠——球球。它有着毛毛的身子，黑豆般的眼睛，十分可爱。班上的同学们都特别喜欢球球。起初，同学们都小心地对待它。后来，大家变得很“热情”，都试着伸手进箱子里要摸它。接下来的日子里，有人把饼干扔进箱子来喂它；还有人倒水进箱子里想为它冲凉。球球也因此变得容易被惊吓到，总是缩在笼子里的一个角落，不肯出来。

      老师发现后，问我们：“喜欢和占有是两回事。喜欢，是想让它快乐；占有，是只想让自己快乐。你们对球球，是哪一种？”

      那天之后，我开始静静观察球球，不再急着摸它。直到一天，我在课室打扫时，看到球球在滚轮上跑着。我心想：它会不会觉得闷？出来外面跑会不会更开心？我想了一会儿，便打开了箱子的盖。

      球球一下子跳了出来，钻进了书架底下。我伸手去抓，怎么也抓不到。我越来越着急，找到了扫把想把它扫出来，球球吓得吱吱叫。

      这时，老师突然走进课室。我吓得脸色苍白，心想：糟糕，惨了！没想到老师了解情况后，并没有骂我，而是拿出一块饼干，把球球引出来。她把球球放回箱子里后，温柔地问我：“老师知道你不是故意的，但你有想过你的行为吓到了球球吗？”我顿时呆住了。

      “爱不是给它你想给的，而是给它它需要的。”听了老师的话，我红着脸，默默地点了点头。

      从那以后，我很用心照顾球球。后来，班上的同学也学会了不再乱喂乱抓球球。球球变得不再那么害怕，有时还会爬上我们的手心呢！
  questions:
    - sourceQuestion: Q21
      marks: 2
      format: MCQ
      text: 从哪里可以看出大家对球球很“热情”？
      options:
        - 大家都特别喜欢球球。
        - 大家都很想摸摸球球。
        - 大家小心地对待球球。
        - 大家都想让自己快乐。
      correct: 大家都很想摸摸球球。
    - sourceQuestion: Q22
      marks: 2
      format: MCQ
      text: “我”为什么要打开箱子的盖？因为___。
      options:
        - “我”想喂球球吃东西。
        - “我”想扫球球的箱子。
