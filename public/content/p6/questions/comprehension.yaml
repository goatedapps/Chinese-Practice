        - 他在赛场上奔跑时。
        - 他看到队友投篮得分时。
        - 他听到观众的掌声和欢呼声时。
      correct: 他听到观众的掌声和欢呼声时。
    - sourceQuestion: Q22
      marks: 2
      format: MCQ
      text: 作者的球队进场时，观众席上为什么静悄悄的？
      options:
        - 因为作者和队员迟到了。
