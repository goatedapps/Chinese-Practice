        - 因为马丽拥有作为医生最重要的品德。
      correct: 因为马丽非常希望到医院面试当医生。
    - sourceQuestion: Q25
      marks: 2
      format: MCQ
      text: 这个故事告诉我们什么道理？
      options:
        - 发烧时一定要到阴凉的地方去。
