      displayAnswer: 山羊先生总在欢欢的作业本上画红圈，圈出错别字，还在旁边写“重写”。欢欢认为自己已经写得很认真，老师却总是不满意，让她心里不服气。
    - sourceQuestion: Q37
      marks: 3
      format: Long-Answer
      text: 从哪里可以看出山羊先生的老师很有责任感？
      displayAnswer: 山羊先生小时候生病、好一段时间没去上课时，他的老师冒着大雨到他家给他补课。
    - sourceQuestion: Q38
      marks: 4
      format: Long-Answer
      text: 山羊先生送给欢欢什么样的礼物？（2分）得到礼物后，欢欢明白了什么？（2分）
      displayAnswer: 山羊先生送给欢欢一本旧字典。字典里写满了他老师的评语，也圈出了他常写错的字。欢欢明白真正的老师不是只会夸人；老师严格批改、指出错误，是为了帮助学生真正成长。
    - sourceQuestion: Q39
      marks: 4
