      displayAnswer: 爷爷看我画的画册，发出赞叹。
      context: 字数不超过15字。
      notes: 参考答案为简洁表述；同义且符合字数限制的答案可接受。
    - sourceQuestion: Q22
      marks: 4
      format: Long-Answer
      text: 作者要拿出画册时，为什么迟疑了？（3分）他最后怎么做？（1分）
