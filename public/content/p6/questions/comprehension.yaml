      correct: 作者投篮一直没有进球。
    - sourceQuestion: Q24
      marks: 2
      format: MCQ
      text: 以下哪一个句子是不正确的？
      options:
        - 作者平时投篮常常进球。
        - 观众能阻止球员获得冠军。
        - 观众对两支球队的态度完全不同。
