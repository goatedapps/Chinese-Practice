      text: 作者转到新学校后有什么感受？（1分）为什么？（2分）
      displayAnswer: 很难受、烦恼／难过。因为一直交不到新朋友，休息时间只能独自到食堂用餐。
    - sourceQuestion: Q20
      marks: 4
      format: Long-Answer
      text: 爷爷认为交朋友需要做到什么？（1分）作者哪些方面不足？（1分）为什么？（2分）
      displayAnswer: 需要心到、眼到、口到和手到。作者缺少口到和手到，因为没有把画册给同学看，也没有主动和同学交谈。
