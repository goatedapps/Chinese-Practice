      displayAnswer: 批评
    - sourceQuestion: Q9
      marks: 2
      format: Fill-in
      text: 把运用不当的词语“珍贵”改正。
      accepted:
        - 珍惜
      displayAnswer: 珍惜
    - sourceQuestion: Q10
