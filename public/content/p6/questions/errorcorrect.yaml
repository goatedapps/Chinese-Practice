      marks: 2
      format: Fill-in
      text: 把“（饼）命”中写错的字改正，只写正确的字。
      accepted:
        - 拼
      displayAnswer: 拼
    - sourceQuestion: Q8
      marks: 2
      format: Fill-in
      text: 把运用不当的词语“批改”改正。
      accepted:
