- groupId: P6-CH-2025-ACSJ-Q30-33
  subject: Chinese
  passage:
    title: 2025年新中交流活动
    source: ACSJ Primary 6 Chinese 2025, Paper 2; PDF pages 19–21; P6_Chinese_2025_SA2_acsjunior.pdf
    text: |-
      为了促进文化学习交流，一年一度的新中交流活动将于2025年8月14日至15日在本校举行。我们将接待来自中国的60名学生，他们会与五、六年级的学生一起上课，并体验新加坡的校园生活。

      交流活动安排如下：
      日期：8月14日至8月15日
      活动：参观校园、学习马来乐器和印度舞、参加足球友谊赛

      与往年不同的是，为了庆祝建校100周年，我们将带着中国同学一起参观学校历史展览。我们也需要从五、六年级的每个班中选出四位“学习伙伴”，陪伴中国同学上课，并在有需要的时候帮他们翻译。有兴趣的同学，请在8月7日前向级任老师报名。

      被选中的“学习伙伴”将于8月14日早上8点在礼堂集合，参加欢迎会，并与伙伴互相交换礼物。

      让我们一起展现新加坡学生的热情，结交新朋友吧！
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 今年的新中交流活动有什么不一样的地方？
      options:
        - 举办足球友谊赛
        - 参观本校历史展览
        - 学习马来乐器和印度舞
        - 新中学生互相交换礼物
      correct: 参观本校历史展览
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 要成为“学习伙伴”的条件是___。
      options:
        - 中英文要好。
        - 能跳印度舞。
        - 足球要踢得好。
        - 喜欢中国文化。
      correct: 中英文要好。
    - sourceQuestion: Q32
      format: MCQ
      marks: 2
      text: 这则通告主要告诉学生什么？
      options:
        - 鼓励学生体验校园生活。
        - 说明足球友谊赛的安排。
        - 介绍新中交流活动的内容。
        - 提醒学生准时参加欢迎会。
      correct: 介绍新中交流活动的内容。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假如你是小光，今年读六年级。请发一则短信给父亲，告诉他你想报名成为“学习伙伴”的原因和要参加的活动。以“爸爸，今年我们学校要举办新中交流活动，我想……”开头。
      displayAnswer: 爸爸，今年我们学校要举办新中交流活动。我想报名成为“学习伙伴”，陪伴中国同学上课，并在有需要的时候帮他们翻译。活动包括参观校园、学习马来乐器和印度舞、参加足球友谊赛；被选中的伙伴还将参加欢迎会，并与伙伴互相交换礼物。
- groupId: P6-CH-2025-ACSPrimary-Q30-33
  subject: Chinese
  passage:
    title: 2025日本旅游展
    source: ACSPrimary Primary 6 Chinese 2025, Paper 2; PDF pages 16–18; P6_Chinese_2025_SA2_acsprimary.pdf
    text: |-
      【2025日本旅游展】缤纷日本，精彩无比！

      你向往美丽的日本风光吗？你想尝尝地道的日本美食吗？赶快来日本旅游展，预定你的日本之旅吧！

      展会亮点：
      便宜机票：老人小孩半价，当日预订可享七折
      特色路线：根据旅客需求，制定不同行程
      文化体验：茶道表演、和服试穿、拉面制作
      互动专区：日本旅游达人分享、动漫角色扮演

      日期：2025年6月1–3日（周五至周日）
      地点：新达城会展中心3楼
      时间：上午10点至晚上8点

      所有到场者都可获赠精美日本特产，还有机会赢取双人东京迪士尼门票！
      要想参加展览，请致电81234666。
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 这个广告主要的目的是什么？
      options:
        - 介绍公众日本的特色路线。
        - 通知公众品尝日本的美食。
        - 鼓励公众参加日本的旅游展。
        - 告诉公众去日本的机票便宜。
      correct: 鼓励公众参加日本的旅游展。
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 要想现场体验日本文化，可以参加以下哪一项活动？
      options:
        - 听达人分享
        - 看茶道表演
        - 读日本漫画
        - 学角色扮演
      correct: 看茶道表演
    - sourceQuestion: Q32
      format: MCQ
      marks: 2
      text: 参加展会并当日预定机票的公众可获得什么？
      options:
        - 机票七折、日本特产
        - 日本漫画、机票七折
        - 迪士尼门票、日本特产
        - 日本漫画、迪士尼门票
      correct: 机票七折、日本特产
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假如你是小文，知道妈妈很想带行动不便的奶奶到日本旅行。请写一则短信给妈妈，告诉她参加这次日本旅游展的两个原因。以“2025日本旅游展来了！我知道您很想带行动不便的奶奶去日本旅行，您可以参加这次日本旅游展，因为……”开头。
      displayAnswer: 因为您可以让他们根据旅客需求制定不同行程。而且有便宜机票，老人半价，当日预订可享七折。
- groupId: P6-CH-2025-AiTong-Q30-33
  subject: Chinese
  passage:
    title: 图书馆临时关闭
    source: AiTong Primary 6 Chinese 2025, Paper 2; PDF pages 17–19; P6_Chinese_2025_SA2_aitong.pdf
    text: |-
      亲爱的师生们：为了给大家提供更好的阅读与学习环境，图书馆将于下周一（8月25日）起开始更新设施，并关闭至下周五（8月29日），为期五天。

      新的图书馆会有什么不一样：
      - 更换旧书架和座椅，让图书摆放更整齐，阅读更舒适。
      - 增加电脑阅读区，提供电脑让学生阅读电子书籍。
      - 设立学习小组讨论室，让同学们在这些小房间里进行小组讨论，不会影响其他借阅书籍的同学。

      注意事项：
      - 图书馆关闭期间，所有图书借还服务将暂时停止。有需要借书的同学，可以去学校图书馆网站借阅电子书籍。
      - 来不及归还已借书籍的同学，可以在9月1日图书馆重新开放后三天内归还。
      - 原本在图书馆举办的爱同画展，从下周一起将会改在爱同美术室继续进行，直到9月5日。各班级任老师会跟同学们分享更多详情。

      感谢大家的配合与支持！
      爱同学校
      8月20日
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 这项通告的主要目的是什么？
      options:
        - 请级任老师分享更多详情。
        - 鼓励学生们去参观爱同画展。
        - 提醒师生们图书馆将会关闭五天。
        - 为学生提供更好的阅读与学习环境。
      correct: 提醒师生们图书馆将会关闭五天。
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 哪一项是图书馆新增加的设施？
      options:
        - 爱同美术室
        - 电脑阅读区
        - 书架和座椅
        - 电子书籍网
      correct: 电脑阅读区
    - sourceQuestion: Q32
      format: MCQ
      marks: 2
      text: 明文来不及在图书馆关闭前还书，还可以在什么时候还？
      options:
        - 8月25日
        - 8月29日
        - 9月1日
        - 9月5日
      correct: 9月1日
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假如你是丽文，明杰要在图书馆关闭期间借书，也想下周看爱同画展。续写短信，告诉他怎么做：“明杰，图书馆将在下周临时关闭五天，所有图书馆内的图书借还服务暂时停止。我知道你下周想要借书，也想要去看爱同画展，你可以……”
      displayAnswer: 去学校图书馆网站借电子书。爱同画展从下周一起改在爱同美术室进行，直到9月5日，你可去那里看画展。
- groupId: P6-CH-2025-Catholic-Q30-33
  subject: Chinese
  passage:
    title: 校园阅读活动
    source: Catholic Primary 6 Chinese 2025, Paper 2; PDF pages 21–23; P6_Chinese_2025_SA2_catholic.pdf
    text: |-
      为了培养同学们对阅读的兴趣，学校将在10月1日至10月31日期间举办校园阅读活动！本次活动开放给全校学生，希望大家能积极参与，尽享阅读的乐趣！

      本次阅读活动包括：
      - 故事朗读比赛（个人赛）
      - 班级阅读角落设计比赛
      - 新书共读
      - 图书展览

      2025年特别之处
      1·选出各年级的“阅读之星”
      2·邀请本地著名作家钟灵分享阅读心得
      日期：2025年10月10日
      时间：早上九点至十点（第一场）
      中午十二点至一点（第二场）
      地点：学校礼堂

      如果你想了解更多活动详情，可以找图书管理员或各班华文老师。想要报名参加活动，请找各班华文老师。有兴趣帮忙进行各项活动，请到办公室找林小姐。让我们以书为友，在阅读中获取知识与快乐！
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 今年阅读活动和之前有什么不同？
      options:
        - 跟学校的图书管理员报名。
        - 学生可参加故事朗读比赛。
        - 邀请作家钟灵分享阅读心得。
        - 举办班级阅读角落设计比赛。
      correct: 邀请作家钟灵分享阅读心得。
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 想了解活动详情应该怎么做？
      options:
        - 去办公室找林小姐。
        - 联系各班华文老师。
        - 积极参与很多活动。
        - 买更多新书来阅读。
      correct: 联系各班华文老师。
    - sourceQuestion: Q32
      format: MCQ
      marks: 2
      text: 通告主要目的是什么？
      options:
        - 通知学生活动的日期。
        - 希望学生能尽早报名。
        - 鼓励学生积极参与活动。
        - 邀请学生和本地作家见面。
      correct: 鼓励学生积极参与活动。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假如你是小佳，续写短信邀明华参加一场阅读心得分享会，说明场次和如何帮他报名：“明华，我想让你跟我一起参加10月10日的阅读心得分享会，……”
      displayAnswer: 我想参加第一场，早上九点至十点。我会帮你向我们班的华文老师报名。
- groupId: P6-CH-2025-HenryPark-Q30-33
  subject: Chinese
  passage:
    title: 人人超市：捐旧物、换食物
    source: HenryPark Primary 6 Chinese 2025, Paper 2; PDF pages 22–23; P6_Chinese_2025_SA2_henrypark.pdf
    text: |-
      人人超市，行善最乐！
      捐旧物、换食物
      活动时间：2025年10月1日至12月31日

      旧报纸或纸张、旧衣物、旧电器 → 换取贴纸 → 换取不同食品
      每公斤以上的旧物可以换取一张贴纸。
      只要收集10个以上的贴纸，就能换取不同食品。

      所有旧物都会卖给再循环公司，所得款项全部捐给红山老人院及童乐孤儿院。
      想了解详情，请查看各分店的布告栏，或上网：www.renrensupermart.sg。
      这是人人超市首届“捐旧物、换食物”活动，欢迎大家为环保尽一份力。
      全岛60家分店都有参与。
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 这则广告主要告诉大家什么？
      options:
        - 人人超市将会收集各种不同种类的旧物品。
        - “捐旧物、换食物”活动将会举行三个月。
        - 人人超市将举办“捐旧物、换食物”活动。
        - 所有人人超市的分行都有参与捐旧物活动。
      correct: 人人超市将举办“捐旧物、换食物”活动。
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 以下哪一种物品不能换取贴纸？
      options:
        - 穿不了的旧校服。
        - 损坏的旧电视机。
        - 用不着的旧木椅。
        - 已读过的旧杂志。
      correct: 用不着的旧木椅。
    - sourceQuestion: Q32
      format: MCQ
      marks: 2
      text: 根据广告，以下哪一项不正确？
      options:
        - 所有捐出的旧物都可以直接换取食品。
        - 可以上网查阅贴纸所能够换取的食品。
        - 所有收集到的旧物会卖给再循环公司。
        - 人人超市第一次办旧物换食物的活动。
      correct: 所有捐出的旧物都可以直接换取食品。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假如你是小丽，写便条邀请爷爷参与这个活动，提出两个参与原因，并说明可以做什么准备。
      displayAnswer: 亲爱的爷爷：人人超市将举办“捐旧物、换食物”活动，请您和我一起参加吧！我们能为环保尽一份力，也可以用收集的贴纸换取食品。我们可以先集合旧报纸、纸张、旧衣物和旧电器，再于2025年10月1日至12月31日带到人人超市全岛六十家分店中的一家，每公斤以上旧物换一张贴纸，收集十个以上就可换取食品。
- groupId: P6-CH-2025-MGS-Q30-33
  subject: Chinese
  passage:
    title: 小六毕业庆祝营
    source: MGS Primary 6 Chinese 2025, Paper 2; PDF pages 15–16; P6_Chinese_2025_SA2_mgs.pdf
    text: |-
      亲爱的小六毕业生们：
      恭喜你完成小六会考！想和同学们一起庆祝这个特别的时刻吗？欢迎参加“小六毕业庆祝营”！
      在两天一夜的活动中，你将参与团队游戏、才艺表演、烧烤晚会、电影之夜等有趣的活动，还有机会认识新朋友，留下美好回忆。

      日期：2025年11月8日（星期六）至11月9日（星期日）
      时间：星期六上午10点至星期日下午4点
      地点：阳光森林度假村
      对象：已完成小六会考的学生
      费用：每人$180（包含住宿、三餐、保险和所有活动用品）

      注意事项：
      - 报名时需提交家长签名的同意书。
      - 报名成功后，主办单位会通知付费详情。
      - 无论任何原因，付费后不能退费。
      - 不可将名额转让给他人。

      有兴趣参加的小朋友，请上网到www.graduation-camp.sg提交报名表格。如有疑问，请拨打65347890联系林老师。报名截止日期是10月15日，名额有限，只限80人，先到先得。
      我们期待与你共度一个难忘的毕业时光！
      新加坡青少年活动中心
      2025年8月20日
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 参加这个毕业营必须具备哪些条件？
      options:
        - 必须在报名时先付清费用，报名才算有效。
        - 必须愿意参加全部活动，包括烧烤和住宿。
        - 必须对团队游戏和才艺表演具有浓厚的兴趣。
        - 必须完成小六会考，并交上家长签名的同意书。
      correct: 必须完成小六会考，并交上家长签名的同意书。
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 根据广告，哪一个是正确的？
      options:
        - 这个毕业庆祝营的地点设在新加坡青少年活动中心。
        - 有兴趣参加者，需要通过指定的网站提交报名表格。
        - 活动从星期六下午四点开始，星期日上午十点结束。
        - 只要在十月十五日前完成报名，就能够参加毕业营。
      correct: 有兴趣参加者，需要通过指定的网站提交报名表格。
    - sourceQuestion: Q32
      format: MCQ
      marks: 2
      text: 举办“小六毕业庆祝营”的主要目的是什么？
      options:
        - 通过才艺表演展示个人能力。
        - 借由团队活动提升合作精神。
        - 通过活动来留下难忘的回忆。
        - 借由认识新朋友丰富朋友圈。
      correct: 通过活动来留下难忘的回忆。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假如你是小安，写便条给爸爸，说出想参加的理由及需要尽早报名的原因，请他帮你报名。
      displayAnswer: 爸爸：我看到“小六毕业庆祝营”的广告，很想参加，因为能和同学一起度过难忘的毕业时光。报名截止日期是10月15日，名额只限80人，先到先得，请您尽早在www.graduation-camp.sg提交报名表格。谢谢。小安，8月20日晚上9点。
- groupId: P6-CH-2025-NanHua-Q30-33
  subject: Chinese
  passage:
    title: “祝福未来”讲故事比赛
    source: NanHua Primary 6 Chinese 2025, Paper 2; PDF pages 13–15; P6_Chinese_2025_SA2_nanhua.pdf
    text: |-
      亲爱的同学们：
      你是否希望能够登上舞台表现自己？现在机会来啦！我校将举办“祝福未来”讲故事比赛，欢迎四至六年级的同学报名参加。

      日期：2025年10月22日
      时间：下午2点
      地点：学校礼堂

      注意事项：
      - 可使用道具。
      - 讲述时间不超过5分钟。
      - 参赛故事必须是自己写的故事。

      感兴趣的同学，请在9月20日前把报名表格交给华文老师，并提交200字以内的故事简介。如有疑问，请到学校办公室找林老师。
      为了更好地帮助同学们准备比赛，学校将举办赛前训练班，邀请著名作家李果来学校教同学们如何写好故事，以及如何把故事讲得更精彩。老师们也会举办一场赛前练习，欢迎同学们参加。
      欢乐小学母语部
      2025年8月20日
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 通告主要目的是___。
      options:
        - 介绍比赛的要求
        - 邀请学生参加比赛
        - 告诉学生比赛的时间
        - 给学生表现自己的机会
      correct: 邀请学生参加比赛
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 想报名参赛的同学应该怎么做？
      options:
