      format: Long-Answer
      marks: 4
      text: 你是美心，9月8日有空，留便条请妈妈帮报名，说明课程及方式。
      displayAnswer: 妈妈：我想参加“舞出精彩”的华族舞蹈课，您可以帮我报名吗？请在9月5日前到www.sgyszx.com报名，谢谢！美心，8月20日上午7点。
