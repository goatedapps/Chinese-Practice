        - 9月1日
        - 9月11日
      correct: 8月30日
    - sourceQuestion: Q32
      format: MCQ
      marks: 2
      text: 哪一个句子是正确的？
      options:
        - 红山民众俱乐部的会员有半价优待。
        - 最先报名的三十名公众有半价优待。
        - 带着儿童报名的公众都有半价优待。
        - 完成了半日游的公众都有半价优待。
      correct: 红山民众俱乐部的会员有半价优待。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假设你是大华，写短信邀请明文参加活动，写出活动详情和注意事项。
      displayAnswer: 明文，我想约你参加红山民众俱乐部9月11日上午9点至中午12点举办的“晚晴园半日游”活动。每人$20，儿童免费。请在8月31日前到www.sengkangcommunityclub.com.sg报名；会员有半价优待。只接受30人，最好尽快报名，希望你可以去。
- groupId: P6-CH-2025-PeiChun-Q30-33
  subject: Chinese
  passage:
    title: 儿童舞蹈班招生
    source: PeiChun Primary 6 Chinese 2025, Paper 2; PDF pages 13–15; P6_Chinese_2025_SA2_peichun.pdf
    text: |-
      学校假期快到了！欢迎家长带孩子报名参加由新加坡舞蹈学校与大巴窑民众俱乐部共同开办的“儿童舞蹈班”，度过充实又有意义的假期。
      经验丰富的舞蹈老师会以目前最流行的韩国音乐和可爱又帅气的动作，让孩子享受跳舞乐趣，提高舞蹈技巧及对舞蹈的热爱。
      课程结束后，上课内容会分享到网站，孩子可在家用电脑或手机观看、复习。

      | 课程 | 初级班（2个班） | 中级班（2个班） |
      | --- | --- | --- |
      | 时间 | 10月至12月，星期六或星期天上午10至11点 | 同左 |
      | 对象 | 7至9岁，零起点 | 7至11岁，学过舞蹈 |
      | 收费 | 200元 | 300元 |

      报名方式：通过新加坡舞蹈学校网站。
      上课地点：大巴窑民众俱乐部2楼。
      招生人数有限，请尽早报名。
      截止日期：2025年9月15日。
      网址：www.dancechildsg.com
      电话：66551234，联系金先生。
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 广告主要目的是什么？
      options:
        - 提高孩子对舞蹈课的兴趣。
        - 介绍更多韩国的流行音乐。
        - 分享新加坡舞蹈学校的位置。
        - 让家长为孩子报名舞蹈课程。
      correct: 让家长为孩子报名舞蹈课程。
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 关于舞蹈班哪项正确？
      options:
        - 中级班和初级班的收费相同。
        - 初级班也只在星期六上午开课。
        - 没有学过舞蹈不能参加中级班。
        - 到大巴窑民众俱乐部2楼报名。
      correct: 没有学过舞蹈不能参加中级班。
    - sourceQuestion: Q32
      format: MCQ
      marks: 2
      text: 为什么要尽快报名？
      options:
        - 因为收费非常合理。
        - 因为招生人数不多。
        - 因为只开一个舞蹈班。
        - 因为在家也能学舞蹈。
      correct: 因为招生人数不多。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假如你是美华，发短信邀没学过舞蹈的小丽参加，说明课程、费用及报名详情。
      displayAnswer: 小丽，我看到“儿童舞蹈班”招生广告，想请你和我一起参加初级班，费用200元。报名网址：www.dancechildsg.com，截止日期2025年9月15日。希望你和我一起报名。
