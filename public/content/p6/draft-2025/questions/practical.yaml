- groupId: P6-CH-2025-SCGS-Q30-33
  subject: Chinese
  passage:
    title: 小学生大梦想
    source: SCGS Primary 6 Chinese 2025, Paper 2; PDF pages 15–17; P6_Chinese_2025_SA2_scgs.pdf
    text: |-
      同学们，你的愿望是什么？想“实现”愿望吗？欢乐小学将举办“小学生大梦想”系列活动。有兴趣的同学请于2025年9月13日（星期六）到学校礼堂，当一天画家、厨师或大歌星。

      我来当大厨师（上午9–11点）：本地著名厨师与学生一起做菜，可把做好的菜带回给父母吃。
      我来当大歌星（下午4–6点）：本地著名歌手教唱歌，唱得好的学生可参加“太阳杯歌唱比赛”。
      我来当大画家（下午1点半至3点）：本地著名画家教画漫画，好的作品将印成漫画书。

      到学校办公室填写表格报名，截止2025年9月1日。
      首20名报名者获小礼包。
      疑问请拨87654321。
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 活动目的是什么？
