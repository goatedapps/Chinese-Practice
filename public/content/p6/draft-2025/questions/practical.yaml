    source: Raffles Primary 6 Chinese 2025, Paper 2; PDF pages 15–16; P6_Chinese_2025_SA2_raffles.pdf
    text: |-
      8月1日至8月31日，与您一起庆祝新加坡60岁生日！
      消费满100元，赠送一个胡姬花图案的杯子。
