- groupId: P6-CH-2025-StNicholas-Q30-33
  subject: Chinese
  passage:
    title: 乐在60你和我
    source: StNicholas Primary 6 Chinese 2025, Paper 2; PDF pages 16–17; P6_Chinese_2025_SA2_chij.pdf
    text: |-
      今年，新加坡将庆祝建国60周年。欢乐民众俱乐部将在8月7日举办适合一家大小的活动，让居民参加。
      时间：上午10点到下午5点
      地点：欢乐民众俱乐部活动广场
      首50个到场的家庭能获取小礼包。

      | 时间 | 活动 |
      | --- | --- |
      | 10点到10点30分 | 新加坡美食品尝（只限30人） |
      | 10点30分到11点 | 乐龄运动操 |
      | 11点到12点30分 | 亲子家庭竞赛（只限10个家庭） |
      | 1点到2点 | 教你怎么煮美食（只限25人） |
      | 2点到4点30分 | 游戏摊位：射气球、丢汽水罐、剪纸、传统游戏（五石子、踢毽子等） |
      | 4点30分到5点 | 爱国歌曲演奏 |

      活动人数有限，请尽早上俱乐部的网站www.hlmzjlb.com报名。想玩游戏的居民必须到俱乐部柜台买票。如果有疑问，可拨打61234567向方丽华小姐询问。
      欢乐民众俱乐部
      7月15日
