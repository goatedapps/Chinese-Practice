- groupId: P6-CH-2025-Nanyang-Q30-33
  subject: Chinese
  passage:
    title: “爱心99”义工日
    source: Nanyang Primary 6 Chinese 2025, Paper 2; PDF pages 14–16; P6_Chinese_2025_SA2_nanyang.pdf
    text: |-
      为了建设一个充满关怀与爱的社区，同时拉近家人之间的关系，红山民众俱乐部邀请您和家人参加“爱心99”这项义工活动。我们将为社区中的独居老人和失业人士送上爱心礼包，传递温暖与希望。

      日期：2025年9月9日（星期日）
      时间：上午9点至下午5点（中午12–1点为午餐时间）
      集合地点：红山民众俱乐部礼堂
      免费提供午餐，不包含早餐和晚餐。
      欢迎5岁以下儿童与65岁以上乐龄人士选择适合项目参与。

      | 活动 | 时间 | 内容与适合人群 |
      | --- | --- | --- |
      | 准备礼包 | 上午9–11点 | 把日用品和$99超市购物券装入礼包；适合所有居民 |
      | 搬运礼包 | 上午11点至中午12点 | 搬运礼包到分发点；不适合儿童和乐龄人士 |
      | 分发礼包 | 下午1–4点 | 上门派送礼包；不适合乐龄人士 |
      | 总结与拍照留念 | 下午4–5点 | 全体义工参与 |

      请在8月15日至9月5日上网www.redhillcc.sg报名。
      欲知详情，请拨电话或发消息至81983348。
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 这则通告主要目的是什么？
      options:
        - 拉近家人之间的关系。
        - 邀请居民参加义工活动。
        - 建设充满关怀与爱的社区。
        - 通知老人领取免费爱心礼包。
      correct: 邀请居民参加义工活动。
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 哪项活动最适合祖孙一起参加？
      options:
        - 准备礼包。
        - 搬运礼包。
        - 分发礼包。
        - 领取礼包。
      correct: 准备礼包。
    - sourceQuestion: Q32
      format: MCQ
      marks: 2
      text: 关于义工日的说明哪一项正确？
      options:
        - 爱心礼包里有$99超市购物券和一张照片。
        - 失业人士可以到红山民众俱乐部领取礼包。
        - 所有社区里的乐龄人士都能获得爱心礼包。
        - 报名参加活动的居民需自己安排早、晚餐。
      correct: 报名参加活动的居民需自己安排早、晚餐。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假如你是小华，写短信邀妈妈参加义工日，说明一个好处及报名方式。
      displayAnswer: 妈妈，我知道您喜欢做义工，想邀请您和我一起参加“爱心99”义工活动，可以拉近一家人的感情。请您在8月15日至9月5日之间上网www.redhillcc.sg报名。
- groupId: P6-CH-2025-PLMGS-Q30-33
  subject: Chinese
  passage:
    title: 晚晴园半日游
    source: PLMGS Primary 6 Chinese 2025, Paper 2; PDF pages 15–17; P6_Chinese_2025_SA2_mgspayalebar.pdf
    text: |-
      为了让人们了解“晚晴园”和它的历史，本民众俱乐部将举办“晚晴园”半日游活动。欢迎任何有兴趣的公众报名参加，最多接受30人报名。

      活动日期及时间：9月11日上午9点至中午12点。
      活动收费：每人$20（儿童免费）。
      报名方法：上网www.sengkangcommunityclub.com.sg报名，截止日期是8月31日。

      活动当天，请大家早上9点在红山民众俱乐部大厅集合，之后搭乘游览车前往“晚晴园”。活动全程会有导游带领，并进行解说。游览结束后，会安排大家在附近的餐馆享用午餐。午餐后，团员可自行决定是否跟随游览车回到红山民众俱乐部。
      注意：红山民众俱乐部会员报名时都可获得半价的优待。
      红山民众俱乐部
      7月24日
  questions:
    - sourceQuestion: Q30
      format: MCQ
      marks: 2
      text: 举办这个活动的目的是什么？
      options:
        - 让俱乐部的会员能一起参加活动。
        - 让有兴趣的公众有机会学习历史。
        - 让参加活动的人能一起享用午餐。
        - 让更多人了解晚晴园和它的历史。
      correct: 让更多人了解晚晴园和它的历史。
    - sourceQuestion: Q31
      format: MCQ
      marks: 2
      text: 想参加活动，可以在什么时候报名？
