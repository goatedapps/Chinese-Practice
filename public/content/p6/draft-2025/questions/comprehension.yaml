      displayAnswer: 他把一个月的工钱全给了老奶奶，还送她去医院。老奶奶的儿子送他一辆全新的电动车，并帮助他开快递中心，当上老板。
    - sourceQuestion: Q40
      format: Long-Answer
      marks: 4
      text: 你认为文中的张先生身上有哪两个优点？试分别举例加以说明。
