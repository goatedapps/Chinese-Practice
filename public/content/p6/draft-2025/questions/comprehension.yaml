- groupId: P6-HC-2025-PLMGS-Q17-23
  subject: Higher Chinese
  passage:
    title: 母亲的隔夜饭
    source: PLMGS Primary 6 Higher Chinese 2025, Paper 2; PDF pages 6–7; P6_HChinese_2025_SA2_mgspayalebar.pdf
    text: |-
      我从小住在一间政府组屋里，屋子虽小，但整洁温暖。父亲早年去世，母亲一个人在小餐馆里打工养家，我们的生活过得紧紧巴巴的。但是，母亲从不让我觉得缺少了什么。每天回家，桌上总是摆着热气腾腾的米饭和香喷喷的菜。母亲盛好饭，总把满满的一碗递给我，自己却只吃几口饭菜。我天真地以为，母亲真的像她说的那样：“妈妈不饿，所以吃得少。”

      直到长大后，我无意中发现了母亲的秘密。那天我提早下班，轻轻推开门，看见母亲正坐在厨房里的角落，拿着一个小碗吃饭。碗里的米饭硬硬的，菜叶也失去了新鲜的颜色。

      看到我进来，母亲呆住，然后赶快笑着说：“怎么提早回来了？快坐下，妈妈给你热饭！”她边说边把手里的碗藏到橱柜里，好像害怕我看见她吃剩饭似的。我鼻子一酸，心里像堵了一块大石头。原来，母亲不是不饿，只是把新鲜的饭菜全留给我吃，自己吃着隔夜饭。

      从那天起，我开始观察母亲的一举一动。逛街时，她总说自己不缺衣服，可是一看到我喜欢的东西，就想办法给我买；家里有好吃的，她总是先让我吃，自己留下一点就满足了；哪怕晚上加班很晚，她一回到家，就马上给我热饭，说：“趁热吃，不然就凉了。”

      有一天晚上，我趁母亲不注意，悄悄为她热了一碗饭，端到她面前。母亲呆住了，随即便笑了，眼角的细纹像花一样盛开。那一刻，我心里升起一种从未有过的温暖。我知道，母亲吃隔夜饭，不是因为喜欢，而是因为心里装着我。母亲只需要一份简单的关心，就会感到满足和快乐。
  questions:
    - sourceQuestion: Q17
      format: Long-Answer
      marks: 2
      text: 解释“天真地以为”（第一段）在文中的意思。
      displayAnswer: 作者看母亲只吃几口饭菜，单纯地相信她是因为不饿才吃得少。
    - sourceQuestion: Q18
      format: Long-Answer
      marks: 2
      text: 解释“眼角的细纹像花一样盛开”（第五段）在文中的意思。
      displayAnswer: 作者替母亲热饭，让母亲感到满足快乐，笑得眼角的皱纹舒展开来。
    - sourceQuestion: Q19
      format: Long-Answer
      marks: 4
      text: 作者一家住在哪里？他的生活是怎样的？
      displayAnswer: 住政府组屋，屋子虽小但整洁温暖。父亲早逝，生活拮据，但母亲把新鲜饭菜留给他，不让他觉得缺少什么，生活温暖。
    - sourceQuestion: Q20
      format: Long-Answer
      marks: 3
      text: “母亲的秘密”指什么？
      displayAnswer: 把新鲜饭菜留给作者，自己吃隔夜饭，并不想让作者知道。
    - sourceQuestion: Q21
      format: Writing-Constrained
      marks: 4
      text: 用不超过15个字写出第四段的段落大意。
      displayAnswer: 母亲对我的爱都表现在她的行动里。
    - sourceQuestion: Q22
      format: Long-Answer
      marks: 4
      text: 母亲是怎样的人？从哪两件事可以看出？
      displayAnswer: 全心全意爱孩子的人。把新鲜饭菜留给作者，自己吃隔夜饭；说自己不缺衣服，却想办法买作者喜欢的东西。
    - sourceQuestion: Q23
      format: Long-Answer
      marks: 5
      text: 你同意“母亲只需要一份简单的关心，就会感到满足和快乐”吗？为什么？举例说明。
      displayAnswer: 示例：同意。作者替母亲热一碗饭，她就笑了，说明简单关心也能让她满足快乐。例如去超市帮妈妈提袋子，或见她累了主动洗碗，妈妈也会开心。
- groupId: P6-HC-2025-Raffles-Q11-16
  subject: Higher Chinese
  passage:
    title: 弟弟，对不起
    source: Raffles Primary 6 Higher Chinese 2025, Paper 2; PDF pages 6–7; P6_HChinese_2025_SA2_raffles.pdf
    text: |-
      每当明文看见书柜门上的那个破洞，往事便一一浮现在眼前……

      那天，明文一做完作业，才想轻松地玩一会儿，就听见妈妈大声吩咐：“明文，快来扫地！”他假装没听到，匆匆跑进房间，把门关上。妈妈见明文没有反应，怒气冲冲地从厨房走了出来，边走边骂他。听到妈妈愤怒的叫骂声，他心想：我刚做完功课，才想玩一会儿，她怎么就要我扫地？顿时，委屈涌上心头，他忍不住对着书柜乱打乱踢一阵，结果踢破了书柜门。那个书柜很贵，要是被妈妈发现，她不但不会原谅他，还会骂他。他该怎么办呢？就在这时，门外传来妈妈的脚步声，他吓得紧贴房门，一动也不敢动。

      “哥哥，你怎么啦？”这时，明文才看见年幼的弟弟也在房里。他打起了坏主意——骗妈妈是弟弟做的！于是，他打开房门，大声地喊道：“妈妈，弟弟闯祸了！”妈妈跑到房里，见书柜门破了一个洞，火冒三丈地骂弟弟。弟弟吓得大哭起来。他没想到，平时把弟弟当宝贝的妈妈，竟然会骂弟弟。看到弟弟害怕的模样，他心里有说不出的滋味。于是，他上前抓住妈妈的手，向妈妈认错：“不要骂弟弟了，书柜门是我踢破的，对不起。”

      多年过去，弟弟早已不记得这件事，但明文只要看到那个书柜，心里还是有种说不出的难受。
