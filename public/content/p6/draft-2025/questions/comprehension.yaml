    - sourceQuestion: Q37
      format: Long-Answer
      marks: 3
      text: 年轻人听到让座要求，有什么反应？
      displayAnswer: 睁眼却没站起来，把手伸进裤袋，似乎在找东西。
    - sourceQuestion: Q38
