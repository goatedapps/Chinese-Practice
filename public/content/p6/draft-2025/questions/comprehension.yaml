- groupId: P6-HC-2025-Nanyang-Q17-23
  subject: Higher Chinese
  passage:
    title: 比金钱更宝贵的东西
    source: Nanyang Primary 6 Higher Chinese 2025, Paper 2; PDF pages 10–11; P6_HChinese_2025_SA2_nanyang.pdf
    text: |-
      又是一个无所事事的长周末，我在家中闷得发慌，突然心血来潮，想去圣淘沙环球影城重拾儿时回忆，便欣然搭上了前往圣淘沙的公共巴士，开始了一场说走就走的“旅行”。巴士缓慢地行驶着，原本无聊的车程被一对刚上车的父子打破了。孩子长得很是可爱，天真烂漫，他牵着父亲的手高兴地与父亲交谈着，很多乘客都被孩子的一举一动所感染，我享受着这对父子之间的温情，脸上的疲累在孩子的笑声中慢慢消失。

      这么巧，这对父子和我一样，也是要去环球影城。下车后，大家一同来到入口处，排队购票入内。售票窗口的玻璃上写着“成人100元，12岁以下儿童半价，1米以下幼童免票”。想必这个孩子已经上学了，能够识字，他指着玻璃跟父亲说道：“爸爸，我今年身高已经超过1米了！”父亲听了，先是沉默不语，接着把食指竖在嘴唇前。孩子看到后点了点头，便不再说话了。

      队伍慢慢移近售票窗口，只听到孩子的父亲对孩子轻声地说：“知道该怎么做了吧？”孩子说：“爸爸，我当然知道，像刚才上巴士一样是不是？”孩子的父亲微笑着点了点头。

      在检查门票前的那一刻，孩子突然把身子“沉”下来，像一只小鸭一般，身子一摇一摆地移进了大门。可能是人太多了，售票员没有发现这个学鸭子走路的孩子，接过那位父亲的那一张成人票，便让他们俩通过了。

      孩子进去以后，身子马上恢复了原样，他抬起下巴，挺起胸，大步往前跨。父亲悄悄地跟孩子竖起了大拇指，接着两人有说有笑地消失在人群里。

      在那一刻，我的心如同被一块大石头压着，心情沉重极了，为那个孩子，也为孩子的父亲。要知道，孩子蹲下来的不只是身体，还有比金钱更宝贵的东西。
  questions:
    - sourceQuestion: Q17
      format: Long-Answer
      marks: 2
      text: 解释“一场说走就走的‘旅行’”（第一段）在文中的意思。
      displayAnswer: 作者突然想去环球影城重拾回忆，就搭巴士出发了。
    - sourceQuestion: Q18
      format: Long-Answer
      marks: 2
      text: 解释“先是沉默不语，接着把食指竖在嘴唇前”（第二段）在文中的意思。
      displayAnswer: 孩子说身高超过一米，父亲先不说话，再用动作阻止他继续说。
    - sourceQuestion: Q19
      format: Long-Answer
      marks: 4
      text: 作者一开始为什么喜欢这对父子？
      displayAnswer: 孩子可爱、天真烂漫，牵着父亲的手高兴交谈，一举一动感染作者。父子温情让作者不再无聊疲累。
    - sourceQuestion: Q20
      format: Long-Answer
      marks: 4
      text: 检查门票之前和之后，孩子的行为有什么不同？目的是什么？
      displayAnswer: 之前蹲低身子摇摆着进去；之后恢复原样，挺胸大步走。目的是假装不足一米，不用买儿童票。
    - sourceQuestion: Q21
      format: Writing-Constrained
      marks: 4
      text: 用不超过20个字写出第四段的段落大意。
      displayAnswer: 孩子沉下身子，售票员没发现，父子俩通过大门。
    - sourceQuestion: Q22
      format: Long-Answer
      marks: 4
      text: 为什么作者的心“如同被一块大石头压着”？
      displayAnswer: 父亲两次教孩子骗人，成功后还称赞，令孩子以为骗人是对的。作者担心他不能明辨是非，感到沉重。
    - sourceQuestion: Q23
      format: Long-Answer
      marks: 4
      text: 你同意有比金钱更宝贵的东西吗？举一个生活中的例子说明。
      displayAnswer: 示例：同意，诚实比金钱宝贵。买笔时阿姨多找五毛，我把多找的钱还给她，得到诚实的称赞，比多拿五毛更开心。
- groupId: P6-HC-2025-PLMGS-Q11-16
  subject: Higher Chinese
  passage:
    title: 跑道以外的坚持
    source: PLMGS Primary 6 Higher Chinese 2025, Paper 2; PDF pages 4–5; P6_HChinese_2025_SA2_mgspayalebar.pdf
    text: |-
      立明是一个热爱跑步的中学生。他从小就梦想有一天能代表学校参加全国比赛。

      可是，距离比赛只剩一个月时，立明在一次训练中，不小心跌倒，右腿骨折。医生告诉他，至少半年不能做剧烈的运动。听了医生的话，立明的眼中渐渐失去了光彩。他感到绝望，把最喜欢的运动服收进了柜子最深处，而且，始终不肯踏进康复治疗室的门。

      一天，老师带来一位坐在轮椅上的客人。那是一位穿着篮球国家队队服的男子，只是，他右腿的裤子被卷起，下面空空的。他微笑着，对大家说：“我曾是一名短跑选手，在一次车祸中失去了一条腿。那段日子我也想过放弃，但我明白，我失去的只是跑道，不是对运动的热爱。”接着，他在轮椅上灵活地转动着篮球，那坚定的眼神和自信的笑容，深深地印在立明心里。

      那晚，立明在床上翻来覆去。他望着天花板，脑中浮现出那位轮椅运动员的笑容。他握紧拳头：“只要我还想跑，就有希望。”第二天，他第一次主动要求去做康复训练。右腿的每一次弯曲、拉伸都痛得像被火烧，额头上的汗水一滴一滴地落在地板上，但他咬紧牙关坚持下来。

      几个月后，立明终于能站起来。第一次重新踏上跑道时，他的眼睛红了：他只是错过了那一年的比赛，但他没有错过成长。他明白了，真正的强者是在困境中仍然怀抱梦想、永不放弃。
