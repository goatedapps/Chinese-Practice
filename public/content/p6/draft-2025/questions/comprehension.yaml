      marks: 4
      text: 老爷爷提出什么建议？小文接受吗？为什么？
      displayAnswer: 把自己的座位让给奶奶。小文没接受，因为老爷爷年纪大，坐着安全，认为应由年轻人让座。
    - sourceQuestion: Q39
      format: Long-Answer
      marks: 4
      text: “双眼闪着泪光”说明什么？为什么？
      displayAnswer: 感动、感激。奶奶理解他的困难，还安慰、关心他。
    - sourceQuestion: Q40
