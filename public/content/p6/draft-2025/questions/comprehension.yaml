      displayAnswer: 怕明华知道他原想拿走钱包的钱，会对他产生坏印象，又不想谎称刚捡到钱包。
    - sourceQuestion: Q39
      format: Long-Answer
      marks: 4
      text: “我心里暖暖的”是什么意思？为什么有这感受？
      displayAnswer: 感动。没想到明华知道他想把钱包占为己有后，仍原谅他，并愿意在他有困难时帮助他。
