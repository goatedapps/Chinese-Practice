      text: 游戏伙伴给了明光什么建议？明光怎么做？
      displayAnswer: 建议让电脑写作文。明光去伙伴介绍的网站输入题目，把生成的作文抄在纸上，第二天交给老师。
    - sourceQuestion: Q20
      format: Long-Answer
      marks: 4
      text: 收到明光的作文，老师说她很高兴。明光有什么反应？为什么？
      displayAnswer: 他高兴不起来，低下头避开老师的眼神，因为作文是网站写的，他知道自己在欺骗老师。
    - sourceQuestion: Q21
      format: Writing-Constrained
      marks: 4
