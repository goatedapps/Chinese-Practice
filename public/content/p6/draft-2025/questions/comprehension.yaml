      accepted:
        - 无精打采
      displayAnswer: 无精打采
    - sourceQuestion: Q36
      format: Long-Answer
      marks: 3
      text: 为什么明伟和哈山会被选为班长？（2分）被选为班长后，他们有什么反应？（1分）
      displayAnswer: 两人成绩优秀，而且乐于助人，很受班上同学欢迎。明伟非常兴奋，决定要成为最棒的班长；哈山挺直了腰，点点头。
    - sourceQuestion: Q37
      format: Long-Answer
      marks: 4
      text: 当好朋友犯错时，明伟和哈山是怎么做的？
      displayAnswer: 明伟不再严格要求好朋友遵守校规，假装没看见；哈山仍要求好朋友遵守秩序，认为这样对大家才公平。
    - sourceQuestion: Q38
      format: Long-Answer
      marks: 4
      text: 后来，同学们对明伟的态度有什么改变？（1分）从哪里可以看出？（3分）
      displayAnswer: 同学们不再像从前那样亲近明伟，认为他做事不公平。他身边说笑的同学渐渐减少，活动时大家总找哈山商量，和哈山有说有笑。
    - sourceQuestion: Q39
      format: Long-Answer
      marks: 3
      text: “这些话像针一样刺在他心上”这句话指的是什么？（2分）明伟为什么有这样的感受？（1分）
      displayAnswer: 明伟听到同学们说他不公平，小杰犯错自己当作没看到，这让明伟心里很难受，像被针刺了一样
    - sourceQuestion: Q40
      format: Long-Answer
      marks: 4
      text: 你认为明伟最后会怎么做？（2分）为什么？（2分）
      displayAnswer: 示例：明伟会像哈山一样公平做事，不会因为是好朋友就假装没看见对方犯错。他希望同学们重新信任他，像从前一样和他说笑、有事找他商量。
- groupId: P6-CH-2025-ACSPrimary-Q21-25
  subject: Chinese
  passage:
    title: 学会管理脾气
    source: ACSPrimary Primary 6 Chinese 2025, Paper 2; PDF pages 13–14; P6_Chinese_2025_SA2_acsprimary.pdf
    text: |-
      小杰是六年级的学生，成绩不错，人也聪明。但是他有一个坏习惯，只要一着急，他就会乱发脾气。小杰的父母担心他改不掉这个毛病。

      那天上科学课，小杰和同学们一起完成一项活动。他们要在有限的时间内找到答案。时间一分一秒地过去，他们那一组还没有找到答案。小杰突然站了起来，大喊：“怎么这么难！”他一生气，就把桌子推倒了，笔也掉了一地。教室一下子安静了，连老师都皱起了眉头。同学们都瞪大了眼睛看着他。

      下课后，老师把他叫到一旁，说：“你已经六年级了，不是小孩子了，要学会不要乱发脾气。”

      小杰听了，低下了头，一句话也没说。他走回座位，把滚落在地上的文具一支一支地捡起来，还轻轻地擦干净。他在心里下定决心：以后要管理好自己的脾气，不再乱发火了。

      第二天早上，小杰走进课室，想跟全班同学道歉，却看到桌上放着几张纸条。纸上写着：“加油！我们一起克服困难！”“朋友不会放弃你！”

      那一刻，小杰的心仿佛轻了一些，也温暖了一些。父母知道这件事后，也放下心来。
