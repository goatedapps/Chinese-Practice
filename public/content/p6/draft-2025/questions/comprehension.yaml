- groupId: P6-HC-2025-TaoNan-Q17-23
  subject: Higher Chinese
  passage:
    title: 陪爷爷说话
    source: TaoNan Primary 6 Higher Chinese 2025, Paper 2; PDF pages 6–7; P6_HChinese_2025_SA2_taonan.pdf
    text: |-
      小时候，父母忙着工作，我几乎是爷爷带大的，我们总有说不完的话。在我的童年里，身边总有爷爷的身影。

      升上中学后，我的生活非常忙碌，一天当中可以与爷爷说话的时间不多。每天的交流也仅限于“吃饱了吗？”“你回来了？”而且都是爷爷主动问我，我累得只能简短地回答“吃了”“是的”。但爷爷并不在意。

      后来，爷爷的年纪大了，有时会犯糊涂。有一次，爷爷睡前突然想喝茶，便去厨房煮水。他想起杯子还放在房间里，回到房间时，却又忘了要做什么，便躺在床上睡着了。我晚上进厨房时才看到快被烧干的锅，便立刻把火关掉。

      第二天，我出门前嘱咐爷爷要注意安全。爷爷一直道歉，但是他的嘴角带着笑。看着他那副开心的样子，我有点不耐烦，心想：差点儿把家都烧了，他还笑？真的是越来越糊涂了。

      那天下午，当我上完课回来后，远远就看到爷爷在楼下和几个邻居聊天。爷爷得意地对他们说：“我孙子每天至少陪我五分钟，今天早上他还和我说了十分钟的话！”看到爷爷的表情充满自豪，我一下子呆住了。我没想到，自己不过是多说了几句话，竟然能让爷爷这么开心。我鼻子一酸，眼泪差点儿流了下来。

      我上前跟爷爷说：“爷爷，我们回家吧！”我牵起他的手，他回头看了我一眼，眼神露出一丝惊喜，笑着点点头。我们慢慢走回家，谁也没有说话，但他的手握得很紧。
  questions:
    - sourceQuestion: Q17
      format: Long-Answer
      marks: 2
      text: 解释“身边总有爷爷的身影”（第一段）在文中的意思。
      displayAnswer: 作者小时候父母忙于工作，所以爷爷总在他身边照顾他。
    - sourceQuestion: Q18
      format: Long-Answer
      marks: 2
      text: 解释“一丝惊喜”（第六段）在文中的意思。
      displayAnswer: 爷爷看见作者主动叫他回家，还牵起他的手，感到既惊讶又开心。
    - sourceQuestion: Q19
      format: Long-Answer
      marks: 4
      text: 升上中学后，作者的生活如何？（1分）这对作者和爷爷的关系有什么影响？（3分）
      displayAnswer: 作者的生活非常忙碌。两人的交流很少而且简短，都是爷爷主动和作者说话，关系不再像以前一样亲密。
    - sourceQuestion: Q20
      format: Writing-Constrained
      marks: 4
      text: 请用不超过18个字写出第三段的段落大意。
      displayAnswer: 爷爷糊涂，忘了关火，我立刻关掉火。
    - sourceQuestion: Q21
      format: Long-Answer
      marks: 3
      text: 作者提醒爷爷要注意安全时，爷爷有什么反应？（1分）作者对爷爷的反应有什么看法？（2分）
      displayAnswer: 爷爷一直道歉，嘴角却带着笑。作者觉得爷爷不应该笑，因为他差点把家烧了；认为他笑是因为越来越糊涂。
    - sourceQuestion: Q22
      format: Long-Answer
      marks: 4
      text: “我鼻子一酸，眼泪差点儿流了下来”这句话说明了什么？
      displayAnswer: 作者感到惭愧、心酸和后悔。以前他不主动和爷爷说话，回答简短，也不耐烦；没想到自己只多说几句话就让爷爷这么开心，所以后悔以前不关心爷爷。
    - sourceQuestion: Q23
      format: Long-Answer
      marks: 5
      text: 你从这篇短文中明白了什么道理？（2分）举例说明如何应用在生活中。（3分）
      displayAnswer: 示例：平时应多关心爷爷奶奶，让他们开心。我会多陪他们聊天，生病时帮他们拿水喝，用这些小事表达关心。
