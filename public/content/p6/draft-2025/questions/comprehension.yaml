      displayAnswer: 担心，失败便被拿走大房子，变成穷人，遭受他人嘲笑。
    - sourceQuestion: Q39
      format: Long-Answer
      marks: 4
      text: 财主比赛时有什么困难？想到了什么办法？
      displayAnswer: 水冷得他全身发抖，又刮大风，受不了。他求天神不要让他冻死，答应把一半金子分给穷人。
    - sourceQuestion: Q40
      format: Long-Answer
