    - sourceQuestion: Q37
      format: Long-Answer
      marks: 4
      text: 当大华走过来恭喜小明时，小明的笑容为什么消失了？
      displayAnswer: 看到名单最顶端写着陈大华。大华深受同学欢迎，小明觉得自己不够好，担心自己不会当选。
    - sourceQuestion: Q38
      format: Long-Answer
      marks: 3
      text: “把演讲稿轻轻折起，塞进书包底层”说明什么？为什么这样做？
      displayAnswer: 小明不想在班上演讲。练习时声音变小、手发抖、额头冒汗、心跳加快，担心大家取笑他，怀疑自己的能力。
    - sourceQuestion: Q39
      format: Long-Answer
      marks: 4
      text: 大华有什么值得你学习的地方？从哪里看出？
      displayAnswer: 他很善良。知道小明被提名后去恭喜他，轻拍他的肩膀，肯定他做事认真、常帮助同学，鼓励他相信自己。
    - sourceQuestion: Q40
      format: Long-Answer
      marks: 4
      text: 小明没当选，为什么仍微笑？生活中尽力却没有理想结果，你会怎么做？
      displayAnswer: 他明白爸爸的话，知道可能失败却仍勇敢尝试。我会继续努力，争取下一次机会，好好练习和表现。
- groupId: P6-CH-2025-NanHua-Q21-25
  subject: Chinese
  passage:
    title: 坚持制作动画
    source: NanHua Primary 6 Chinese 2025, Paper 2; PDF pages 10–11; P6_Chinese_2025_SA2_nanhua.pdf
    text: |-
      明华从小就爱看动画片，长大后想要学做动画，但父母希望他长大后当医生。为了不让父母失望，明华考上了大学，毕业后就能成为一名医生。读大学三年级那年，他看到一个动画制作工具，这个工具激起了他对动画的兴趣。从那以后，明华便开始自学制作动画。大学毕业后，他放弃了当医生的机会，全心全意地追求做动画的梦想。

      明华的这个决定让所有人感到意外。他不去找工作，每天呆在房间里，靠父母养活他。邻居们都觉得明华有点不正常。那时候他们家里很穷，每天都吃不饱。夏天热得满头大汗，冬天冷得手指动不了，但他还是坚持画画。

      三年后，明华完成了第一个动画短片，并获得了30多个奖项，但这些并没有让他的生活变得更好，有人还在背后嘲笑他：“得奖能当饭吃吗？”

      七年后，明华终于有机会制作自己的电影。在制作电影期间，他有时为了一个细节，就修改了上百次。又过了四年，他的第一部电影终于在电影院播出，这部电影不仅受到了大家的欢迎，还赚了很多钱。明华的付出终于有了收获。

      从被嘲笑的追梦者到动画大师，明华用行动证明：坚持到底的人，才能看到希望。
