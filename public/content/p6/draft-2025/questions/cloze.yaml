    title: 面对批评的态度
    source: PeiChun Primary 6 Chinese 2025, Paper 2; PDF pages 9; P6_Chinese_2025_SA2_peichun.pdf
    text: |-
      有三个学习画画的人，想要将自己最满意的作品用一千元卖出，他们的第一位顾客都说了一句相同的话：“这一幅画[Q16]___值不了那么多钱吧。”

      其中一个人听了以后，用心地观察自己的画，发现他的画有许多可以[Q17]___的地方。后来他经过一番努力，终于成为著名的大画家。

      第二个人听后，看了看自己的画，摇了摇头，从此以后不再画画，而是去[Q18]___其他的兴趣爱好。后来，他发现自己很喜欢写字，就努力地写字，成为了一名书法家。

      第三个人认为自己的画不值一千元，便用五百元卖出。但是，找他买画的人很少，他只能过着[Q19]___的生活。

      这个故事告诉我们：批评可能是动力，能让你越来越好；批评可能是机会，帮助你找到更加适合自己的路；批评也可能让你失去[Q20]___，让你从此不再追求进步。因此，你要学会用正确的态度面对批评。
