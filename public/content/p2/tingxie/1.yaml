    description: The little dog happily runs around.
  - text: 我和朋友一起分享苹果。
    segments:
      - 我
      - 和
      - 朋友
      - 一起
      - 分享
      - 苹果
      - 。
    icon: activity
    description: Sharing an apple together with a friend.
