  passage:
    title: 亲子阅读日
    source: 老师自编 — 应用文/通告
    text: |-
      亲子阅读日

      为了培养同学们的阅读兴趣，阳光小学将在11月8日（星期六）上午九点到十一点，在学校图书馆举办"亲子阅读日"活动。

      活动详情：
      时间：上午九点到十一点　地点：学校图书馆
      对象：一年级到三年级学生，须由一位家长陪同参加

      活动内容包括：讲故事时间、亲子阅读角、小小图书管理员体验。

      参加者可获得一本精美故事书作为纪念品。
      如果想报名参加，请在11月1日前到办公室向王老师登记。

      阳光小学
      2025年10月20日
  questions:
    - marks: 2
      format: MCQ
      text: “亲子阅读日”活动在哪里举行？
      options:
        - key: "1"
          text: 学校礼堂
        - key: "2"
          text: 学校图书馆
        - key: "3"
          text: 学校操场
        - key: "4"
          text: 学校食堂
      correctKey: "2"
    - marks: 2
      format: MCQ
      text: 想参加这项活动，应该找谁报名？
      options:
        - key: "1"
          text: 王老师
        - key: "2"
          text: 陈小姐
        - key: "3"
          text: 校长
        - key: "4"
          text: 图书馆管理员
      correctKey: "1"
