    title: 小狗迷路了
    source: 老师自编
    text: |-
      星期六，小明带着小狗到公园散步。小狗看见一只蝴蝶，就 [Q1]___ 地追了过去。

      小明找不到小狗，心里很 [Q2]___。他大声喊小狗的名字，可是没有人回应。

      过了一会儿，小明看见小狗在大树下坐着，他跑过去 [Q3]___ 地抱起了小狗。
