  subject: Chinese
  lessonIds: []
  passage:
    title: 小狗迷路了
    source: 老师自编
    text: |-
      星期六，小明带着小狗到公园散步。小狗看见一只蝴蝶，就 [Q1]___ 地追了过去。

      小明找不到小狗，心里很 [Q2]___。他大声喊小狗的名字，可是没有人回应。

      过了一会儿，小明看见小狗在大树下坐着，他跑过去 [Q3]___ 地抱起了小狗。
  questions:
    - format: MCQ
      text: 小狗看见一只蝴蝶，就 ___ 地追了过去。
      options:
        - 慢慢
        - 高兴
        - 快快
        - 安静
      correct: 快快
    - format: MCQ
      text: 小明找不到小狗，心里很 ___。
      options:
        - 开心
        - 着急
        - 骄傲
        - 轻松
      correct: 着急
    - format: MCQ
      text: 他跑过去 ___ 地抱起了小狗。
      options:
        - 高兴
        - 生气
        - 伤心
        - 害怕
      correct: 高兴
